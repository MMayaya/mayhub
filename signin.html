<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | May Learning Hub</title>

    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        .auth-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        
        .auth-card h2 { 
            color: #0056ff; 
            text-shadow: 0 0 10px rgba(0, 86, 255, 0.2);
            margin-bottom: 1.5rem; 
        }
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
        }

        .btn { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            margin-top: 10px; 
            transition: all 0.3s ease; 
        }
        
        .btn-primary { 
            background: linear-gradient(135deg, #0056ff, #00d4ff); 
            color: white; 
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
            transform: translateY(-1px);
        }

        .btn-primary:disabled { 
            background: #a1c4f4; 
            box-shadow: none; 
            cursor: not-allowed; 
        }
        
        .forgot-password-container { 
            text-align: right; 
            margin: 4px 0 12px 0; 
        }
        
        .link-text { 
            color: #0072ff; 
            font-size: 0.85rem; 
            text-decoration: none; 
            font-weight: 600; 
        }

        .link-text:hover { 
            text-decoration: underline; 
            text-shadow: 0 0 8px rgba(0, 114, 255, 0.3); 
        }
        
        #status-message { 
            margin-top: 12px; 
            font-size: 0.9rem; 
            color: #cc0000; 
            font-weight: 600; 
        }
    </style>
</head>

<body>

<div class="auth-card">
    <h2>May Learning Hub</h2>
    <p>Sign in to access activities and chatrooms</p>

    <input type="email" id="email" placeholder="Email Address" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    
    <div class="forgot-password-container">
        <a href="#" id="forgotPassword" class="link-text">Forgot Password?</a>
    </div>

    <button id="emailLogin" class="btn btn-primary">Sign In</button>

    <div id="status-message"></div>

    <p style="margin-top:20px; font-size: 0.9rem;">
        New here? 
        <a href="signup.html" class="link-text" style="font-size: 0.9rem;">Create an account</a>
    </p>
</div>

<script type="module">
    // Firebase imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app-check.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        onAuthStateChanged,
        sendPasswordResetEmail 
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

    // Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyApyOAfcEB8nGc-B3IO4X8wIl-nVi3nKeo",
        authDomain: "maylearninghub.firebaseapp.com",
        projectId: "maylearninghub",
        storageBucket: "maylearninghub.firebasestorage.app",
        messagingSenderId: "237875455146",
        appId: "1:237875455146:web:21310d33b56664d669dcd3",
        measurementId: "G-LJMFCM44TQ"
    };

    // Initialize Firebase services
    const app = initializeApp(firebaseConfig);

    // Allow App Check to work on local computer for testing
    if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }

    const appCheck = initializeAppCheck(app, {
        provider: new ReCaptchaV3Provider('6LfPNb0sAAAAAKWmsT-rqt2jQTfOuJWTN9Wlv4Vj'),
        isTokenAutoRefreshEnabled: true
    });

    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    // UI elements
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailLoginBtn = document.getElementById('emailLogin');
    const forgotPasswordLink = document.getElementById('forgotPassword');
    const statusMessage = document.getElementById('status-message');

    function setLoading(isLoading, customText = null) {
        emailLoginBtn.disabled = isLoading;

        if (isLoading) {
            emailLoginBtn.textContent = customText || "Signing in...";
        } else {
            emailLoginBtn.textContent = "Sign In";
        }
    }

    function showError(message) {
        console.error(message);
        statusMessage.textContent = message;
        statusMessage.style.color = "#cc0000";
    }

    function showSuccess(message) {
        statusMessage.textContent = message;
        statusMessage.style.color = "#00c853";
    }

    // Redirection logic
    const handleRedirect = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlRedirect = urlParams.get('redirect');
        const savedRedirect = sessionStorage.getItem('redirectURL');

        let nextURL = urlRedirect || savedRedirect || 'index.html';

        try {
            const destination = new URL(nextURL, window.location.origin);

            if (destination.origin !== window.location.origin) {
                nextURL = 'index.html';
            } else {
                nextURL = destination.href;
            }

        } catch (error) {
            nextURL = 'index.html';
        }

        sessionStorage.removeItem('redirectURL');
        window.location.href = nextURL;
    };

    // Auto-redirect logic
    onAuthStateChanged(auth, (user) => {
        if (user) {
            setLoading(true); 
            handleRedirect();
        }
    });

    // Email login
    emailLoginBtn.onclick = async () => {
        const email = emailInput.value.trim();
        const pass = passwordInput.value;

        statusMessage.textContent = '';

        if (!email || !pass) {
            showError("Please enter both your email address and password.");
            return;
        }

        try {
            setLoading(true);
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (err) { 
            showError("Error: " + err.message);
            setLoading(false);
        }
    };

    // Password reset functionality
    forgotPasswordLink.onclick = async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        statusMessage.textContent = '';

        if (!email) {
            showError("Please enter your email address first to reset your password.");
            return;
        }

        try {
            setLoading(true, "Sending Link...");

            // Password reset settings
            const actionCodeSettings = {
                url: "https://maylearninghub.co.za/signin.html",
                handleCodeInApp: false
            };

            // Send Firebase password reset email
            await sendPasswordResetEmail(auth, email, actionCodeSettings);

            showSuccess("Password reset email sent! Please check your inbox or spam folder.");
            setLoading(false);

        } catch (err) {
            console.error("Password reset error:", err.code, err.message);
            showError("Error: " + err.code + " - " + err.message);
            setLoading(false);
        }
    };

    // Allow Enter key to submit email/password login
    passwordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            emailLoginBtn.click();
        }
    });
</script>

</body>
</html>
