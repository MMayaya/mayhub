<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>May Learning Hub Presentation</title>
  <style>
    html,
    body,
    #presentationFrame {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
    }

    #message {
      box-sizing: border-box;
      display: none;
      max-width: 42rem;
      margin: 3rem auto;
      padding: 1.25rem;
      color: #7f1d1d;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 0.5rem;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }
  </style>
  <script>
    (function () {
      "use strict";

      var parameters = new URLSearchParams(window.location.search);
      var requestedPath = parameters.get("path");
      var requestedSlide = Number.parseInt(parameters.get("slide"), 10);
      var presentationUrl = null;

      if (!Number.isInteger(requestedSlide) || requestedSlide < 1) {
        requestedSlide = 1;
      }

      try {
        if (!requestedPath) {
          throw new Error("No presentation path was supplied.");
        }

        presentationUrl = new URL(requestedPath, window.location.origin);

        if (presentationUrl.origin !== window.location.origin) {
          throw new Error("Only presentations on this website can be opened.");
        }

        if (!/\.html?$/i.test(presentationUrl.pathname)) {
          throw new Error("The presentation path must point to an HTML page.");
        }
      } catch (error) {
        presentationUrl = null;
        window.launcherError = error.message;
      }

      // iSpring finds this connector in the parent window when the presentation
      // is loaded in the iframe below.
      window.ispringPresentationConnector = {
        register: function (player) {
          try {
            player
              .view()
              .playbackController()
              .gotoSlide(requestedSlide - 1, false);
          } catch (error) {
            showMessage("This presentation could not open slide " + requestedSlide + ".");
          }
        }
      };

      function showMessage(message) {
        var frame = document.getElementById("presentationFrame");
        var messageBox = document.getElementById("message");

        if (frame) {
          frame.style.display = "none";
        }

        if (messageBox) {
          messageBox.textContent = message;
          messageBox.style.display = "block";
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        if (!presentationUrl) {
          showMessage(window.launcherError || "Invalid presentation link.");
          return;
        }

        document.getElementById("presentationFrame").src = presentationUrl.href;
      });
    }());
  </script>
</head>
<body>
  <div id="message" role="alert"></div>
  <iframe
    id="presentationFrame"
    title="May Learning Hub presentation"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
</body>
</html>
