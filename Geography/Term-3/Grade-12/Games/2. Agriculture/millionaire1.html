<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 12 Geography: Agriculture Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }

        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }

        .game-header { text-align: center; padding: 2rem 1rem 1rem; }
        .game-title { color: #004080; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 1.5rem; font-size: 1.1rem; }

        .game-wrapper { display: flex; max-width: 1100px; margin: 0 auto 3rem; gap: 2rem; padding: 0 20px; width: 100%; align-items: flex-start; }

        .game-board { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 6px solid #3385ff; padding: 2rem; display: flex; flex-direction: column; }

        .lifelines { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .lifeline-btn { background: #002b5e; color: #fff; border: 2px solid #b3d4ff; padding: 0.8rem 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .lifeline-btn:hover:not(:disabled) { background: #3385ff; transform: translateY(-2px); }
        .lifeline-btn:disabled { background: #ccc; border-color: #aaa; color: #666; cursor: not-allowed; transform: none; box-shadow: none; text-decoration: line-through; }

        .question-box { background: #004080; color: #fff; padding: 2rem; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 2rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .answer-btn { background: #f0f7ff; border: 2px solid #3385ff; color: #002b5e; padding: 1.2rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; position: relative; overflow: hidden; }
        .answer-btn::before { content: attr(data-letter) ": "; color: #3385ff; margin-right: 0.5rem; }
        .answer-btn:hover:not(:disabled) { background: #e6f0fa; border-color: #004080; transform: scale(1.02); }

        .answer-btn.selected { background: #ffc107; border-color: #d39e00; color: #000; }
        .answer-btn.correct { background: #28a745 !important; border-color: #1e7e34 !important; color: #fff !important; }
        .answer-btn.incorrect { background: #dc3545 !important; border-color: #bd2130 !important; color: #fff !important; }
        .answer-btn.hidden { visibility: hidden; }

        .prize-ladder { width: 280px; background: #001a33; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column-reverse; gap: 0.1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.2); max-height: 600px; overflow-y: auto; }
        .ladder-step { display: flex; justify-content: space-between; padding: 0.2rem 0.6rem; color: #66a3ff; font-weight: bold; border-radius: 4px; transition: all 0.3s; font-size: 0.85rem; }
        .ladder-step.active { background: #ffc107; color: #000; transform: scale(1.05); }
        .ladder-step.passed { color: #28a745; }
        .ladder-step.milestone { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.2); }

        #endScreen { display: none; text-align: center; padding: 3rem 1rem; }
        #endMessage { font-size: 1.8rem; color: #004080; margin-bottom: 1rem; }
        #endPrize { font-size: 2.5rem; color: #28a745; font-weight: bold; margin-bottom: 2rem; }

        @media (max-width: 850px) {
            .game-wrapper { flex-direction: column; }
            .prize-ladder { width: 100%; flex-direction: row; flex-wrap: wrap; height: auto; }
            .answers-grid { grid-template-columns: 1fr; }
        }

        footer { text-align: center; padding: 1rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">R1,000,000 Geography Challenge</h1>
        <p class="game-subtitle">Agriculture (Grade 12 Term 3)</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Agriculture - Grade 12 Geography Term 3 presentation.</p>
    </header>

    <main class="game-wrapper">
        <div class="game-board" id="gameBoard">
            <div class="lifelines">
                <button class="lifeline-btn" id="btn5050" onclick="use5050()">50 / 50</button>
                <button class="lifeline-btn" id="btnHint" onclick="useHint()">Get a Hint</button>
            </div>

            <div class="question-box">
                <span id="questionText">Loading question...</span>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-letter="A" id="btn0" onclick="selectAnswer(0)"></button>
                <button class="answer-btn" data-letter="B" id="btn1" onclick="selectAnswer(1)"></button>
                <button class="answer-btn" data-letter="C" id="btn2" onclick="selectAnswer(2)"></button>
                <button class="answer-btn" data-letter="D" id="btn3" onclick="selectAnswer(3)"></button>
            </div>
        </div>

        <div class="game-board" id="endScreen">
            <h2 id="endMessage">Game Over!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Your final winnings:</p>
            <div id="endPrize">R0</div>
            <button class="lifeline-btn" onclick="location.reload()">New Game</button>
        </div>

        <div class="prize-ladder" id="prizeLadder"></div>
    </main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const questions = [
            { q: "Which is a direct contribution of agriculture?", options: ["Seeds supplied to farms", "Percentage contribution to GDP", "Packaging", "Food security"], a: 1, hint: "It is an immediate measurable contribution." },
            { q: "What is forward integration?", options: ["Activities such as packaging, distribution, and sales", "Inputs such as seeds and fertilisers", "Only crop production", "Only irrigation"], a: 0, hint: "It moves products toward the consumer." },
            { q: "Which set contains only backward-integration inputs?", options: ["Markets, cooperatives, and sales", "Exports, packaging, and stalls", "Seeds, fertilisers, machinery, and fuel", "GDP, labour, and food security"], a: 2, hint: "These are supplied to farmers before or during production." },
            { q: "What is commercial farming?", options: ["Farming with no output", "Farming only for household needs", "Farming without inputs", "Farming that sells surplus for profit"], a: 3, hint: "It is market-oriented." },
            { q: "What proportion of arable land is devoted to large-scale commercial farms?", options: ["30%", "70%", "13%", "50%"], a: 1, hint: "It is more than twice the small-scale share." },
            { q: "Which feature best describes a large-scale farm?", options: ["High output and financial turnover", "Low output and no credit", "Only family labour", "About one hectare in size"], a: 0, hint: "Commercial scale brings higher production and value." },
            { q: "Which feature best describes a small-scale farm?", options: ["Many employees", "High farm value", "Mostly family-run", "Easy access to credit"], a: 2, hint: "Household labour is common." },
            { q: "When can a small farm operate commercially?", options: ["When it has no sales", "When it avoids capital", "When it produces only for household use", "When intensive inputs produce a surplus for profit"], a: 3, hint: "Small size does not prevent commercial farming." },
            { q: "Which list contains domestic agricultural products from the lesson?", options: ["Rubber, coffee, and cotton", "Maize, potatoes, sugarcane, and meat", "Only wine and wool", "Only citrus and grapes"], a: 1, hint: "These support the home market." },
            { q: "Which agricultural export is ranked first?", options: ["Wine", "Citrus", "Grapes", "Wool"], a: 0, hint: "It is produced strongly in the winter-rainfall region." },
            { q: "Which export is ranked fourth?", options: ["Maize", "Citrus", "Sugarcane", "Wool"], a: 2, hint: "It grows well on the wetter east coast." },
            { q: "What position does wool hold in the export ranking?", options: ["First", "Fifth", "Second", "Tenth"], a: 3, hint: "It is last in the top-ten table." },
            { q: "What share of South African land is suitable for farming?", options: ["50%", "13%", "70%", "30%"], a: 1, hint: "It is a relatively small proportion." },
            { q: "What is identified as agriculture's greatest hindrance?", options: ["Water availability", "Too many markets", "Excess fertile soil", "Easy access to credit"], a: 0, hint: "Nearly half the country's water is already used for farming." },
            { q: "Which Highveld rainfall pattern favours agriculture?", options: ["600-800 mm winter rain", "More than 1,000 mm coastal rain", "500-700 mm summer rain", "Below 200 mm"], a: 2, hint: "The Highveld is a summer-rainfall region." },
            { q: "What does southwestern Cape winter rainfall support?", options: ["Sugar only", "Stock farming only", "Subtropical forest only", "Grapes, fruit, winter wheat, and olives"], a: 3, hint: "Think Mediterranean-type crops." },
            { q: "What farming pattern occurs west of the 500 mm isohyet?", options: ["Rain-fed crop farming everywhere", "Mainly stock farming", "Subtropical fruit farming", "Winter wheat everywhere"], a: 1, hint: "Rainfall is drier and less reliable." },
            { q: "Why do marginal crop areas require irrigation?", options: ["Rainfall near the 500 mm isohyet is unreliable", "They have too many permanent rivers", "They receive excessive winter rain", "They have no evaporation"], a: 0, hint: "Natural moisture is not dependable enough." },
            { q: "How does South Africa's average temperature favour agriculture?", options: ["It prevents all crop growth", "It creates frost every day", "About 15 C allows a wide variety of crops", "It limits farming to one crop"], a: 2, hint: "The country extends from subtropical to temperate latitudes." },
            { q: "What is the minimum frost-free growing period stated for arable areas?", options: ["50 days", "100 days", "150 days", "At least 200 days"], a: 3, hint: "It provides a long growing season." },
            { q: "Which relief feature favours mechanisation?", options: ["Steep escarpment", "Flat plateau and coastal plains", "Deep incised valleys", "Mountain cliffs"], a: 1, hint: "Machinery works best on level land." },
            { q: "Why do rivers west of the 500 mm isohyet often dry up?", options: ["Low rainfall, high evaporation, and sandy soils", "Excess rainfall and clay soils", "Low evaporation", "Permanent groundwater everywhere"], a: 0, hint: "All three factors reduce reliable flow." },
            { q: "Which vegetation factor favours grazing?", options: ["Fast-regrowing subtropical forest", "Bare eroded soil", "Mixed grasses and shrubs", "Overgrazed land"], a: 2, hint: "It provides natural animal feed." },
            { q: "How has soil fertility been reduced?", options: ["By improved transport", "By trade agreements", "By opposite seasons", "By soil overuse and erosion"], a: 3, hint: "Productive topsoil has been damaged." },
            { q: "What is the aim of post-1994 land reform?", options: ["To prevent all farm ownership", "To provide farmland to previously landless people", "To increase apartheid restrictions", "To end commercial farming"], a: 1, hint: "It addresses historical exclusion." },
            { q: "Why has productivity declined on some emerging farms?", options: ["Insufficient knowledge of commercial farming", "Too much access to finance", "Too many employees", "Excess farm value"], a: 0, hint: "Skills and experience matter alongside land access." },
            { q: "What market advantage comes from opposite seasons?", options: ["South Africa cannot export in summer", "Europe produces the same fruit at the same time", "South Africa supplies fruit and flowers during Europe's winter", "All trade stops in winter"], a: 2, hint: "Seasonal timing reduces direct competition." },
            { q: "How can trade liberalism harm the home market?", options: ["It always raises local prices", "It stops all imports", "It guarantees local dominance", "Cheap imports may undercut South African producers"], a: 3, hint: "Imported goods can be sold below local prices." },
            { q: "Which factor can improve agricultural sales?", options: ["Rising machinery costs", "Improved transport networks", "HIV/AIDS", "Crop disease"], a: 1, hint: "Products reach markets more effectively." },
            { q: "Which factor hinders commercial farmers?", options: ["Rising input costs and price fluctuations", "New farming techniques", "Farm consolidation", "Better transport"], a: 0, hint: "Machinery, seeds, and fertilisers become more expensive." }
        ];
        const prizes = [
            "R100", "R200", "R300", "R500", "R1,000",
            "R2,000", "R3,000", "R4,000", "R5,000", "R10,000",
            "R15,000", "R20,000", "R25,000", "R30,000", "R40,000",
            "R50,000", "R60,000", "R70,000", "R80,000", "R100,000",
            "R150,000", "R200,000", "R250,000", "R300,000", "R400,000",
            "R500,000", "R600,000", "R750,000", "R850,000", "R1,000,000"
        ];

        let currentLevel = 0;
        let isWaiting = false;

        const ladderContainer = document.getElementById('prizeLadder');
        for (let i = 0; i < 30; i++) {
            let step = document.createElement('div');
            step.className = 'ladder-step';
            step.id = `ladder-${i}`;
            if ((i + 1) % 5 === 0) step.classList.add('milestone');
            step.innerHTML = `<span>${i + 1}</span> <span>${prizes[i]}</span>`;
            ladderContainer.appendChild(step);
        }

        function loadQuestion() {
            isWaiting = false;
            document.querySelectorAll('.ladder-step').forEach((el, index) => {
                el.classList.remove('active');
                if (index < currentLevel) el.classList.add('passed');
            });
            document.getElementById(`ladder-${currentLevel}`).classList.add('active');

            const qData = questions[currentLevel];
            document.getElementById('questionText').innerText = `Q${currentLevel + 1}: ${qData.q}`;

            let options = [...qData.options];
            let correctText = options[qData.a];
            options.sort(() => Math.random() - 0.5);
            let correctIdx = options.indexOf(correctText);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn${i}`);
                btn.innerText = options[i];
                btn.className = 'answer-btn';
                btn.disabled = false;
                btn.classList.remove('hidden', 'selected', 'correct', 'incorrect');
                btn.setAttribute('data-correct', i === correctIdx);
            }
        }

        function selectAnswer(selectedIndex) {
            if (isWaiting) return;
            isWaiting = true;

            const selectedBtn = document.getElementById(`btn${selectedIndex}`);
            const isCorrect = selectedBtn.getAttribute('data-correct') === 'true';
            if (isCorrect) MayHubSounds.playCorrect();
            else MayHubSounds.playWrong();

            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).disabled = true;
            }

            selectedBtn.classList.add('selected');

            setTimeout(() => {
                selectedBtn.classList.remove('selected');

                if (isCorrect) {
                    selectedBtn.classList.add('correct');
                    setTimeout(() => {
                        currentLevel++;
                        if (currentLevel >= 30) endGame(true);
                        else loadQuestion();
                    }, 1000);
                } else {
                    selectedBtn.classList.add('incorrect');
                    for (let i = 0; i < 4; i++) {
                        if (document.getElementById(`btn${i}`).getAttribute('data-correct') === 'true') {
                            document.getElementById(`btn${i}`).classList.add('correct');
                        }
                    }
                    setTimeout(() => endGame(false), 2000);
                }
            }, 1000);
        }

        function use5050() {
            if (isWaiting) return;
            document.getElementById('btn5050').disabled = true;
            let hiddenCount = 0;
            for(let i=0; i<4; i++){
                let btn = document.getElementById(`btn${i}`);
                if(btn.getAttribute('data-correct') === 'false' && hiddenCount < 2) {
                    btn.classList.add('hidden');
                    hiddenCount++;
                }
            }
        }

        function useHint() {
            if (isWaiting) return;
            document.getElementById('btnHint').disabled = true;
            alert("Geography Teacher Hint: " + questions[currentLevel].hint);
        }

        function endGame(won) {
            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            if (won) {
                document.getElementById('endMessage').innerText = "Geography Legend!";
                document.getElementById('endPrize').innerText = "R1,000,000";
            } else {
                document.getElementById('endMessage').innerText = "Final Winnings:";
                document.getElementById('endPrize').innerText = currentLevel > 0 ? prizes[currentLevel - 1] : "R0";
            }
        }
        loadQuestion();
    </script>
</body>
</html>
