<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 12 Geography: Food Security Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }

        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }

        .game-header { text-align: center; padding: 2rem 1rem 1rem; }
        .game-title { color: #004080; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 1.5rem; font-size: 1.1rem; }

        .game-wrapper { display: flex; max-width: 1100px; margin: 0 auto 3rem; gap: 2rem; padding: 0 20px; width: 100%; align-items: flex-start; }

        .game-board { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 6px solid #3385ff; padding: 2rem; display: flex; flex-direction: column; }

        .lifelines { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .lifeline-btn { background: #002b5e; color: #fff; border: 2px solid #b3d4ff; padding: 0.8rem 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .lifeline-btn:hover:not(:disabled) { background: #3385ff; transform: translateY(-2px); }
        .lifeline-btn:disabled { background: #ccc; border-color: #aaa; color: #666; cursor: not-allowed; transform: none; box-shadow: none; text-decoration: line-through; }

        .question-box { background: #004080; color: #fff; padding: 2rem; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 2rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .answer-btn { background: #f0f7ff; border: 2px solid #3385ff; color: #002b5e; padding: 1.2rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; position: relative; overflow: hidden; }
        .answer-btn::before { content: attr(data-letter) ": "; color: #3385ff; margin-right: 0.5rem; }
        .answer-btn:hover:not(:disabled) { background: #e6f0fa; border-color: #004080; transform: scale(1.02); }

        .answer-btn.selected { background: #ffc107; border-color: #d39e00; color: #000; }
        .answer-btn.correct { background: #28a745 !important; border-color: #1e7e34 !important; color: #fff !important; }
        .answer-btn.incorrect { background: #dc3545 !important; border-color: #bd2130 !important; color: #fff !important; }
        .answer-btn.hidden { visibility: hidden; }

        .prize-ladder { width: 280px; background: #001a33; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column-reverse; gap: 0.1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.2); max-height: 600px; overflow-y: auto; }
        .ladder-step { display: flex; justify-content: space-between; padding: 0.2rem 0.6rem; color: #66a3ff; font-weight: bold; border-radius: 4px; transition: all 0.3s; font-size: 0.85rem; }
        .ladder-step.active { background: #ffc107; color: #000; transform: scale(1.05); }
        .ladder-step.passed { color: #28a745; }
        .ladder-step.milestone { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.2); }

        #endScreen { display: none; text-align: center; padding: 3rem 1rem; }
        #endMessage { font-size: 1.8rem; color: #004080; margin-bottom: 1rem; }
        #endPrize { font-size: 2.5rem; color: #28a745; font-weight: bold; margin-bottom: 2rem; }

        @media (max-width: 850px) {
            .game-wrapper { flex-direction: column; }
            .prize-ladder { width: 100%; flex-direction: row; flex-wrap: wrap; height: auto; }
            .answers-grid { grid-template-columns: 1fr; }
        }

        footer { text-align: center; padding: 1rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">R1,000,000 Geography Challenge</h1>
        <p class="game-subtitle">Food Security (Grade 12 Term 3)</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Food Security - Grade 12 Geography Term 3 presentation.</p>
    </header>

    <main class="game-wrapper">
        <div class="game-board" id="gameBoard">
            <div class="lifelines">
                <button class="lifeline-btn" id="btn5050" onclick="use5050()">50 / 50</button>
                <button class="lifeline-btn" id="btnHint" onclick="useHint()">Get a Hint</button>
            </div>

            <div class="question-box">
                <span id="questionText">Loading question...</span>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-letter="A" id="btn0" onclick="selectAnswer(0)"></button>
                <button class="answer-btn" data-letter="B" id="btn1" onclick="selectAnswer(1)"></button>
                <button class="answer-btn" data-letter="C" id="btn2" onclick="selectAnswer(2)"></button>
                <button class="answer-btn" data-letter="D" id="btn3" onclick="selectAnswer(3)"></button>
            </div>
        </div>

        <div class="game-board" id="endScreen">
            <h2 id="endMessage">Game Over!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Your final winnings:</p>
            <div id="endPrize">R0</div>
            <button class="lifeline-btn" onclick="location.reload()">New Game</button>
        </div>

        <div class="prize-ladder" id="prizeLadder"></div>
    </main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const questions = [
            {
                "q": "Which statement defines food security?",
                "options": [
                    "Food produced only by commercial farms",
                    "All people always have physical and economic access to sufficient, safe, nutritious food",
                    "Food stored but never distributed",
                    "Temporary access to any food"
                ],
                "a": 1,
                "hint": "The definition combines who, when, access, quantity, safety, and nutrition."
            },
            {
                "q": "Which phrase shows that food security must be continuous?",
                "options": [
                    "At all times",
                    "All people",
                    "Economic access",
                    "Safe food"
                ],
                "a": 0,
                "hint": "It refers to the time dimension."
            },
            {
                "q": "Which pair names the access types in the food-security definition?",
                "options": [
                    "Rural and urban",
                    "Social and cultural",
                    "Local and global",
                    "Physical and economic"
                ],
                "a": 3,
                "hint": "One concerns reach; the other concerns affordability."
            },
            {
                "q": "Which pillar means that enough food is supplied?",
                "options": [
                    "Access",
                    "Utilization",
                    "Availability",
                    "Stability"
                ],
                "a": 2,
                "hint": "It concerns the quantity present."
            },
            {
                "q": "Which pillar asks whether people can obtain food?",
                "options": [
                    "Stability",
                    "Access",
                    "Availability",
                    "Utilization"
                ],
                "a": 1,
                "hint": "Food may exist but still be out of reach."
            },
            {
                "q": "Which pillar focuses on proper nutrition and health?",
                "options": [
                    "Utilization",
                    "Availability",
                    "Stability",
                    "Access"
                ],
                "a": 0,
                "hint": "It concerns how food supports the body."
            },
            {
                "q": "Which pillar requires consistent access over time?",
                "options": [
                    "Availability",
                    "Utilization",
                    "Access",
                    "Stability"
                ],
                "a": 3,
                "hint": "It prevents access from being temporary."
            },
            {
                "q": "What is food insecurity?",
                "options": [
                    "Adequate access to nutritious food",
                    "A successful feeding scheme",
                    "Lack of adequate physical, social, or economic access to food",
                    "A stable food supply"
                ],
                "a": 2,
                "hint": "It is the opposite condition to security."
            },
            {
                "q": "Which type of food insecurity is persistent?",
                "options": [
                    "Transitory",
                    "Chronic",
                    "Stable",
                    "Seasonal access"
                ],
                "a": 1,
                "hint": "It lasts over a long period."
            },
            {
                "q": "Which type is short-term or temporary?",
                "options": [
                    "Transitory food insecurity",
                    "Chronic food insecurity",
                    "Food stability",
                    "Food utilization"
                ],
                "a": 0,
                "hint": "The word means passing rather than permanent."
            },
            {
                "q": "Which feature belongs to food security in the comparison table?",
                "options": [
                    "Limited or no access",
                    "Unsafe or insufficient food",
                    "Temporary or chronic hunger",
                    "Access to adequate food"
                ],
                "a": 3,
                "hint": "Security provides adequacy."
            },
            {
                "q": "Which feature belongs to food insecurity?",
                "options": [
                    "Long-term stability",
                    "Nutritional and safe food",
                    "Limited or no access",
                    "Adequate food access"
                ],
                "a": 2,
                "hint": "It describes being unable to obtain enough food."
            },
            {
                "q": "Why does food security improve educational outcomes?",
                "options": [
                    "Children focus better when not hungry",
                    "Hunger lengthens lessons",
                    "Food replaces teaching",
                    "Schools require fewer teachers"
                ],
                "a": 0,
                "hint": "Nutrition supports concentration."
            },
            {
                "q": "Which economic benefit is linked to food security?",
                "options": [
                    "Higher unemployment",
                    "Economic development",
                    "More transport costs",
                    "Greater inequality"
                ],
                "a": 1,
                "hint": "A healthier productive population supports growth."
            },
            {
                "q": "Which social challenges can food security reduce?",
                "options": [
                    "Drought and floods",
                    "Roads and storage",
                    "Inflation and transport",
                    "Poverty and inequality"
                ],
                "a": 3,
                "hint": "Both concern unequal material well-being."
            },
            {
                "q": "How do climate and weather patterns influence food security?",
                "options": [
                    "Droughts and floods affect crop production",
                    "They always lower prices",
                    "They guarantee land access",
                    "They remove hunger"
                ],
                "a": 0,
                "hint": "Think about farm output."
            },
            {
                "q": "Why do poverty and unemployment threaten food security?",
                "options": [
                    "They increase demand only",
                    "They improve infrastructure",
                    "Many households cannot afford food",
                    "They improve crop rotation"
                ],
                "a": 2,
                "hint": "This is an economic-access problem."
            },
            {
                "q": "What issue connects land and water access to food security?",
                "options": [
                    "Everyone owns equal land",
                    "Water is not used in farming",
                    "Food prices cannot change",
                    "Unequal land ownership affects farming"
                ],
                "a": 3,
                "hint": "Ownership shapes who can produce food."
            },
            {
                "q": "What is the effect of population growth?",
                "options": [
                    "Lower food demand",
                    "Increased demand for food",
                    "Automatic price reductions",
                    "Fewer consumers"
                ],
                "a": 1,
                "hint": "More people need to be fed."
            },
            {
                "q": "Which two forces affect food affordability?",
                "options": [
                    "Inflation and transport costs",
                    "Crop rotation and water conservation",
                    "Training and subsidies",
                    "Gardens and feeding schemes"
                ],
                "a": 0,
                "hint": "Both can raise the final price."
            },
            {
                "q": "What is the role of education and awareness?",
                "options": [
                    "To create rainfall",
                    "To increase inflation",
                    "To provide knowledge about nutrition and agriculture",
                    "To replace food supply"
                ],
                "a": 2,
                "hint": "It builds useful knowledge."
            },
            {
                "q": "What does agricultural support involve?",
                "options": [
                    "Drought and flood relief only",
                    "Government subsidies and training for farmers",
                    "Higher food prices",
                    "Less storage"
                ],
                "a": 1,
                "hint": "It combines money and skills."
            },
            {
                "q": "How can land reform improve food security?",
                "options": [
                    "By ensuring fair agricultural-land distribution",
                    "By increasing transport costs",
                    "By reducing crop production",
                    "By limiting farmer access"
                ],
                "a": 0,
                "hint": "It addresses unequal access to land."
            },
            {
                "q": "Which strategy provides better roads, storage, and transport?",
                "options": [
                    "Urban agriculture",
                    "Social grants",
                    "Sustainable farming",
                    "Improved infrastructure"
                ],
                "a": 3,
                "hint": "These are physical systems supporting distribution."
            },
            {
                "q": "Which practice is part of sustainable farming?",
                "options": [
                    "Food-price inflation",
                    "Crop rotation",
                    "Chronic hunger",
                    "Unequal land ownership"
                ],
                "a": 1,
                "hint": "It helps maintain soil productivity."
            },
            {
                "q": "Which list contains only sustainable-farming approaches from the lesson?",
                "options": [
                    "Technology, crop rotation, and water conservation",
                    "Inflation, transport costs, and poverty",
                    "Grants, roads, and population growth",
                    "Droughts, floods, and unemployment"
                ],
                "a": 0,
                "hint": "The lesson lists three practical farming approaches."
            },
            {
                "q": "Which example belongs to social grants and feeding schemes?",
                "options": [
                    "Export subsidies",
                    "Farm consolidation",
                    "School nutrition programmes",
                    "Higher transport costs"
                ],
                "a": 2,
                "hint": "It directly feeds learners."
            },
            {
                "q": "What does urban agriculture encourage?",
                "options": [
                    "Only commercial exports",
                    "Home and community gardens",
                    "Fewer local crops",
                    "More food inflation"
                ],
                "a": 1,
                "hint": "Food is produced close to where people live."
            },
            {
                "q": "At which levels does the conclusion say action is required?",
                "options": [
                    "Household only",
                    "Government only",
                    "Community and business only",
                    "Household, community, and government"
                ],
                "a": 3,
                "hint": "The response must operate at several scales."
            },
            {
                "q": "Who has a role in addressing food security?",
                "options": [
                    "Everyone, from farmers to consumers",
                    "Only government",
                    "Only commercial farmers",
                    "Only households"
                ],
                "a": 0,
                "hint": "Responsibility is shared broadly."
            }
        ];
        const prizes = [
            "R100", "R200", "R300", "R500", "R1,000",
            "R2,000", "R3,000", "R4,000", "R5,000", "R10,000",
            "R15,000", "R20,000", "R25,000", "R30,000", "R40,000",
            "R50,000", "R60,000", "R70,000", "R80,000", "R100,000",
            "R150,000", "R200,000", "R250,000", "R300,000", "R400,000",
            "R500,000", "R600,000", "R750,000", "R850,000", "R1,000,000"
        ];

        let currentLevel = 0;
        let isWaiting = false;

        const ladderContainer = document.getElementById('prizeLadder');
        for (let i = 0; i < 30; i++) {
            let step = document.createElement('div');
            step.className = 'ladder-step';
            step.id = `ladder-${i}`;
            if ((i + 1) % 5 === 0) step.classList.add('milestone');
            step.innerHTML = `<span>${i + 1}</span> <span>${prizes[i]}</span>`;
            ladderContainer.appendChild(step);
        }

        function loadQuestion() {
            isWaiting = false;
            document.querySelectorAll('.ladder-step').forEach((el, index) => {
                el.classList.remove('active');
                if (index < currentLevel) el.classList.add('passed');
            });
            document.getElementById(`ladder-${currentLevel}`).classList.add('active');

            const qData = questions[currentLevel];
            document.getElementById('questionText').innerText = `Q${currentLevel + 1}: ${qData.q}`;

            let options = [...qData.options];
            let correctText = options[qData.a];
            options.sort(() => Math.random() - 0.5);
            let correctIdx = options.indexOf(correctText);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn${i}`);
                btn.innerText = options[i];
                btn.className = 'answer-btn';
                btn.disabled = false;
                btn.classList.remove('hidden', 'selected', 'correct', 'incorrect');
                btn.setAttribute('data-correct', i === correctIdx);
            }
        }

        function selectAnswer(selectedIndex) {
            if (isWaiting) return;
            isWaiting = true;

            const selectedBtn = document.getElementById(`btn${selectedIndex}`);
            const isCorrect = selectedBtn.getAttribute('data-correct') === 'true';
            if (isCorrect) MayHubSounds.playCorrect();
            else MayHubSounds.playWrong();

            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).disabled = true;
            }

            selectedBtn.classList.add('selected');

            setTimeout(() => {
                selectedBtn.classList.remove('selected');

                if (isCorrect) {
                    selectedBtn.classList.add('correct');
                    setTimeout(() => {
                        currentLevel++;
                        if (currentLevel >= 30) endGame(true);
                        else loadQuestion();
                    }, 1000);
                } else {
                    selectedBtn.classList.add('incorrect');
                    for (let i = 0; i < 4; i++) {
                        if (document.getElementById(`btn${i}`).getAttribute('data-correct') === 'true') {
                            document.getElementById(`btn${i}`).classList.add('correct');
                        }
                    }
                    setTimeout(() => endGame(false), 2000);
                }
            }, 1000);
        }

        function use5050() {
            if (isWaiting) return;
            document.getElementById('btn5050').disabled = true;
            let hiddenCount = 0;
            for(let i=0; i<4; i++){
                let btn = document.getElementById(`btn${i}`);
                if(btn.getAttribute('data-correct') === 'false' && hiddenCount < 2) {
                    btn.classList.add('hidden');
                    hiddenCount++;
                }
            }
        }

        function useHint() {
            if (isWaiting) return;
            document.getElementById('btnHint').disabled = true;
            alert("Geography Teacher Hint: " + questions[currentLevel].hint);
        }

        function endGame(won) {
            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            if (won) {
                document.getElementById('endMessage').innerText = "Geography Legend!";
                document.getElementById('endPrize').innerText = "R1,000,000";
            } else {
                document.getElementById('endMessage').innerText = "Final Winnings:";
                document.getElementById('endPrize').innerText = currentLevel > 0 ? prizes[currentLevel - 1] : "R0";
            }
        }
        loadQuestion();
    </script>
</body>
</html>
