    <meta charset="UTF-8">

    <title>May Learning Hub | Grade 12 Geography: Structure of the Economy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }

        /* Navigation */
        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }

        /* Header */
        .game-header { text-align: center; padding: 3rem 1rem 1rem; max-width: 900px; margin: 0 auto; }
        .game-title { color: #004080; font-size: 2.5rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 2rem; font-size: 1.1rem; }

        /* Categories */
        .category-selection { margin-bottom: 2.5rem; }
        .cat-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
        .cat-btn { background-color: #f0f4f8; border: 2px solid #004080; color: #004080; padding: 0.8rem 1.5rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .cat-btn:hover, .cat-btn.active { background-color: #004080; color: #fff; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,64,128,0.2); }

        .controls { display: none; justify-content: center; align-items: center; gap: 2rem; margin-bottom: 2rem; }
        .move-counter { font-size: 1.2rem; font-weight: bold; color: #004080; background: #fff; padding: 0.6rem 1.8rem; border-radius: 50px; border: 2px solid #3385ff; }
        .restart-btn { background-color: #3385ff; color: #fff; border: none; padding: 0.7rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; border-bottom: 3px solid #004080; }

        /* Memory Grid */
        .memory-game { display: none; width: 100%; max-width: 1200px; margin: 0 auto 4rem; grid-template-columns: repeat(5, 1fr); gap: 15px; padding: 0 20px; perspective: 1000px; }

        @media (max-width: 950px) { .memory-game { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 650px) { .memory-game { grid-template-columns: repeat(2, 1fr); } }

        .memory-card { position: relative; width: 100%; aspect-ratio: 1 / 1.2; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
        .memory-card.flip { transform: rotateY(180deg); }

        .front-face, .back-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
            font-size: 1rem;
            line-height: 1.4;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .front-face { background: #004080; color: #fff; font-size: 2.5rem; border: 3px solid #3385ff; font-weight: bold; }
        .back-face { background: #fff; color: #002b5e; transform: rotateY(180deg); border: 3px solid #004080; font-weight: 700; }
        .memory-card.matched .back-face { background: #d4edda; border-color: #28a745; color: #155724; }

        footer { text-align: center; padding: 1.5rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">Grade 12 Geography: Structure of the Economy</h1>
        <p class="game-subtitle">Match economic sectors, activities, value addition, income, GDP, and employment!</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Structure of the Economy - Grade 12 Geography Term 3 presentation.</p>

        <div class="category-selection">
            <div class="cat-buttons">
                <button class="cat-btn" onclick="selectCategory('topic1', this)">Sector Foundations</button>
                <button class="cat-btn" onclick="selectCategory('topic2', this)">Primary Sector</button>
                <button class="cat-btn" onclick="selectCategory('topic3', this)">Secondary Sector</button>
                <button class="cat-btn" onclick="selectCategory('topic4', this)">Tertiary Sector</button>
                <button class="cat-btn" onclick="selectCategory('topic5', this)">Quaternary and Income</button>
                <button class="cat-btn" onclick="selectCategory('topic6', this)">South African Contributions</button>
            </div>
        </div>

        <div class="controls" id="gameControls">
            <div class="move-counter">Moves: <span id="moves">0</span></div>
            <button class="restart-btn" onclick="initGame()">Restart Level</button>
        </div>
    </header>

    <main class="memory-game" id="gameBoard"></main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const sectorFoundations = [
            { term: "Economy", detail: "The system of activities through which a country produces, distributes, and uses goods and services." },
            { term: "Economic Sector", detail: "A category used to simplify and organise economic activities by the type of work performed." },
            { term: "Primary Sector", detail: "The sector that extracts and exploits raw materials from the natural environment." },
            { term: "Secondary Sector", detail: "The sector that processes primary materials into finished consumer products." },
            { term: "Tertiary Sector", detail: "The sector that distributes products and provides services." },
            { term: "Quaternary Sector", detail: "The sector concerned with scientific research and data collection and processing." },
            { term: "Value Added", detail: "The increase in usefulness and economic worth created by work performed on a material or task." },
            { term: "Income", detail: "Money earned from work, shown as increasing with higher and more complex economic sectors." }
        ];
        const primaryActivities = [
            { term: "Extraction", detail: "The removal of natural resources or raw materials from the environment." },
            { term: "Raw Material", detail: "A natural input that can be processed into another product." },
            { term: "Farming", detail: "A primary activity involving the production of crops or livestock." },
            { term: "Fishing", detail: "A primary activity involving the harvesting of aquatic resources." },
            { term: "Forestry", detail: "A primary activity involving the use and management of forest resources." },
            { term: "Hunting", detail: "A primary activity involving obtaining wild animals from the natural environment." },
            { term: "Mining", detail: "A primary activity involving the extraction of minerals from the earth." },
            { term: "Quarrying", detail: "A primary activity involving the extraction of stone or similar material from an open excavation." }
        ];
        const secondaryActivities = [
            { term: "Processing", detail: "Changing a primary material into a more useful product." },
            { term: "Finished Product", detail: "A completed good that is ready for the consumer." },
            { term: "Manufacturing", detail: "Making products by transforming raw or primary materials." },
            { term: "Wheat Milling", detail: "The secondary process that changes wheat into flour." },
            { term: "Bread Baking", detail: "The secondary process that changes flour into bread for consumers." },
            { term: "Car Manufacturing", detail: "A secondary activity shown in the industrial-sector flow diagram." },
            { term: "Steel Works", detail: "A secondary activity that processes materials to produce steel products." },
            { term: "Construction", detail: "A secondary activity represented by builders in the sector-flow diagram." }
        ];
        const tertiaryActivities = [
            { term: "Distribution", detail: "Moving and supplying products so that they reach consumers." },
            { term: "Service Provision", detail: "Supplying useful work to meet needs rather than extracting or manufacturing a product." },
            { term: "Transport", detail: "A tertiary service that moves people or goods." },
            { term: "Trade", detail: "A tertiary activity involving the exchange and sale of products." },
            { term: "Electrical Services", detail: "A service example listed under tertiary economic activities." },
            { term: "Financial Services", detail: "A tertiary activity providing money-related and banking services." },
            { term: "Medical Services", detail: "A tertiary activity providing health care." },
            { term: "Education", detail: "A tertiary service that provides teaching and learning." }
        ];
        const quaternaryIncome = [
            { term: "Scientific Research", detail: "A quaternary activity that investigates questions and develops knowledge." },
            { term: "Data Collection", detail: "Gathering information as part of quaternary economic work." },
            { term: "Data Processing", detail: "Organising and transforming collected information into a useful form." },
            { term: "Information Technology", detail: "A quaternary activity involving computer-based information and data systems." },
            { term: "Call Centre", detail: "A quaternary example involving information and telephone-based customer contact." },
            { term: "Task Complexity", detail: "The difficulty of work, described as greater in tertiary and higher sectors." },
            { term: "Low Primary Wages", detail: "The income result associated with the least value being added by primary-sector workers." },
            { term: "Highest Sector Salaries", detail: "Pay associated with quaternary and quinary work where value input and complexity are greatest." }
        ];
        const southAfricanContributions = [
            { term: "Primary GDP Share", detail: "The 10% contribution shown for the primary sector in the 2016 table." },
            { term: "Primary Employment Share", detail: "The 9% workforce contribution shown for the primary sector in the 2016 table." },
            { term: "Secondary GDP Share", detail: "The 21% contribution shown for the secondary sector in the 2016 table." },
            { term: "Secondary Employment Share", detail: "The 26% workforce contribution shown for the secondary sector in the 2016 table." },
            { term: "Tertiary GDP Share", detail: "The 69% contribution shown for the tertiary sector in the 2016 table." },
            { term: "Tertiary Employment Share", detail: "The 65% workforce contribution shown for the tertiary sector in the 2016 table." },
            { term: "Largest Detailed GDP Category", detail: "Finance at 18.5% in Figure 5.1." },
            { term: "Largest Detailed Employment Category", detail: "Trade at 22.7% in Figure 5.2." }
        ];
        const toCards = factors => factors.flatMap((factor, index) => [
            { id: index + 1, text: factor.detail },
            { id: index + 1, text: factor.term }
        ]);
        const gameData = {
            topic1: toCards(sectorFoundations),
            topic2: toCards(primaryActivities),
            topic3: toCards(secondaryActivities),
            topic4: toCards(tertiaryActivities),
            topic5: toCards(quaternaryIncome),
            topic6: toCards(southAfricanContributions)
        };
        const gameBoard = document.getElementById('gameBoard');
        const movesDisplay = document.getElementById('moves');
        const gameControls = document.getElementById('gameControls');

        let currentCategory = null;
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;

        function selectCategory(categoryKey, btnElement) {
            currentCategory = categoryKey;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            gameControls.style.display = 'flex';
            gameBoard.style.display = 'grid';
            initGame();
        }

        function initGame() {
            gameBoard.innerHTML = '';
            moves = 0;
            matchedPairs = 0;
            movesDisplay.innerText = moves;
            hasFlippedCard = false;
            lockBoard = false;

            const categoryData = gameData[currentCategory];
            const shuffledCards = [...categoryData].sort(() => 0.5 - Math.random());

            shuffledCards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('memory-card');
                cardElement.dataset.pairId = card.id;

                cardElement.innerHTML = `
                    <div class="front-face">?</div>
                    <div class="back-face">${card.text}</div>
                `;

                cardElement.addEventListener('click', flipCard);
                gameBoard.appendChild(cardElement);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            movesDisplay.innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.pairId === secondCard.dataset.pairId;
            if (isMatch) {
                MayHubSounds.playCorrect();
                disableCards();
            } else {
                MayHubSounds.playWrong();
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matchedPairs++;
            if (matchedPairs === (gameData[currentCategory].length / 2)) {
                setTimeout(() => alert(`Great job! Grade 12 Geography: Structure of the Economy Revision Complete in ${moves} moves.`), 500);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1200);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }
    </script>
</body>
</html>
