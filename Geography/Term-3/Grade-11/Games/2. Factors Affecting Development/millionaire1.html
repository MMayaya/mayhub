<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 11 Geography: Factors Affecting Development Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }
        
        .game-header { text-align: center; padding: 2rem 1rem 1rem; }
        .game-title { color: #004080; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 1.5rem; font-size: 1.1rem; }

        .game-wrapper { display: flex; max-width: 1100px; margin: 0 auto 3rem; gap: 2rem; padding: 0 20px; width: 100%; align-items: flex-start; }
        
        .game-board { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 6px solid #3385ff; padding: 2rem; display: flex; flex-direction: column; }
        
        .lifelines { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .lifeline-btn { background: #002b5e; color: #fff; border: 2px solid #b3d4ff; padding: 0.8rem 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .lifeline-btn:hover:not(:disabled) { background: #3385ff; transform: translateY(-2px); }
        .lifeline-btn:disabled { background: #ccc; border-color: #aaa; color: #666; cursor: not-allowed; transform: none; box-shadow: none; text-decoration: line-through; }

        .question-box { background: #004080; color: #fff; padding: 2rem; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 2rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .answer-btn { background: #f0f7ff; border: 2px solid #3385ff; color: #002b5e; padding: 1.2rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; position: relative; overflow: hidden; }
        .answer-btn::before { content: attr(data-letter) ": "; color: #3385ff; margin-right: 0.5rem; }
        .answer-btn:hover:not(:disabled) { background: #e6f0fa; border-color: #004080; transform: scale(1.02); }
        
        .answer-btn.selected { background: #ffc107; border-color: #d39e00; color: #000; }
        .answer-btn.correct { background: #28a745 !important; border-color: #1e7e34 !important; color: #fff !important; }
        .answer-btn.incorrect { background: #dc3545 !important; border-color: #bd2130 !important; color: #fff !important; }
        .answer-btn.hidden { visibility: hidden; }

        .prize-ladder { width: 280px; background: #001a33; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column-reverse; gap: 0.1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.2); max-height: 600px; overflow-y: auto; }
        .ladder-step { display: flex; justify-content: space-between; padding: 0.2rem 0.6rem; color: #66a3ff; font-weight: bold; border-radius: 4px; transition: all 0.3s; font-size: 0.85rem; }
        .ladder-step.active { background: #ffc107; color: #000; transform: scale(1.05); }
        .ladder-step.passed { color: #28a745; }
        .ladder-step.milestone { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.2); } 

        #endScreen { display: none; text-align: center; padding: 3rem 1rem; }
        #endMessage { font-size: 1.8rem; color: #004080; margin-bottom: 1rem; }
        #endPrize { font-size: 2.5rem; color: #28a745; font-weight: bold; margin-bottom: 2rem; }

        @media (max-width: 850px) {
            .game-wrapper { flex-direction: column; }
            .prize-ladder { width: 100%; flex-direction: row; flex-wrap: wrap; height: auto; } 
            .answers-grid { grid-template-columns: 1fr; }
        }
        
        footer { text-align: center; padding: 1rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">R1,000,000 Geography Challenge</h1>
        <p class="game-subtitle">Factors Affecting Development (Grade 11 Term 3)</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Factors Affecting Development - Grade 11 Geography Term 3 presentation.</p>
    </header>

    <main class="game-wrapper">
        <div class="game-board" id="gameBoard">
            <div class="lifelines">
                <button class="lifeline-btn" id="btn5050" onclick="use5050()">50 / 50</button>
                <button class="lifeline-btn" id="btnHint" onclick="useHint()">Get a Hint</button>
            </div>

            <div class="question-box">
                <span id="questionText">Loading question...</span>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-letter="A" id="btn0" onclick="selectAnswer(0)"></button>
                <button class="answer-btn" data-letter="B" id="btn1" onclick="selectAnswer(1)"></button>
                <button class="answer-btn" data-letter="C" id="btn2" onclick="selectAnswer(2)"></button>
                <button class="answer-btn" data-letter="D" id="btn3" onclick="selectAnswer(3)"></button>
            </div>
        </div>

        <div class="game-board" id="endScreen">
            <h2 id="endMessage">Game Over!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Your final winnings:</p>
            <div id="endPrize">R0</div>
            <button class="lifeline-btn" onclick="location.reload()">New Game</button>
        </div>

        <div class="prize-ladder" id="prizeLadder"></div>
    </main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const questions = [
            { q: "Which factor is necessary for economic activities and growth?", options: ["Infrastructure", "Migration", "Pollution", "Ownership"], a: 0, hint: "It provides the physical foundation for economic activity." },
            { q: "Which factor funds development projects and creates jobs?", options: ["Investment", "Crime rates", "Air quality", "Population growth"], a: 0, hint: "It supplies money for projects." },
            { q: "What creates a conducive environment for growth?", options: ["Economic policies", "Natural disasters", "Pollution", "Resource depletion"], a: 0, hint: "Governments use these to shape economic conditions." },
            { q: "Which factor boosts productivity and innovation?", options: ["Technology", "Migration", "Waste management", "Social services"], a: 0, hint: "It improves how work and production are done." },
            { q: "The effect of natural resources on development depends on:", options: ["How they are managed", "Crime rates only", "Migration only", "Ownership only"], a: 0, hint: "They can either drive or hinder development." },
            { q: "Trade boosts economic growth through:", options: ["Market access", "Resource depletion", "Pollution", "Natural disasters"], a: 0, hint: "It connects producers and buyers." },
            { q: "What facilitates investments and economic activities?", options: ["Financial systems", "Climate change", "Crime rates", "Migration"], a: 0, hint: "It helps funds move through the economy." },
            { q: "What drives economic diversification and innovation?", options: ["Entrepreneurship", "Resource depletion", "Natural disasters", "Pollution"], a: 0, hint: "It involves creating and growing new ventures." },
            { q: "Which social factor provides skills and knowledge for economic growth?", options: ["Education", "Migration", "Crime rates", "Population growth"], a: 0, hint: "Learning builds human capacity." },
            { q: "Which factor affects overall well-being and productivity?", options: ["Healthcare", "Trade", "Land use", "Ownership"], a: 0, hint: "Healthy people can participate more productively." },
            { q: "What ensures a safe environment for investment and growth?", options: ["Social stability", "Pollution", "Resource depletion", "Natural disasters"], a: 0, hint: "Safety and order support confidence." },
            { q: "What shapes work ethics, entrepreneurship, and gender roles?", options: ["Cultural attitudes", "Water availability", "Financial systems", "Waste management"], a: 0, hint: "Shared beliefs and values influence behaviour." },
            { q: "Population growth influences:", options: ["Resource allocation and workforce size", "Air quality only", "Market access only", "Project ownership only"], a: 0, hint: "It changes both demand and the number of workers." },
            { q: "Equal opportunities enhance productivity through:", options: ["Gender equality", "Pollution", "Migration", "Resource depletion"], a: 0, hint: "Everyone should have the same opportunities." },
            { q: "Which factor reduces poverty and inequality?", options: ["Social services", "Natural disasters", "Crime rates", "Pollution"], a: 0, hint: "Public support can improve people's welfare." },
            { q: "Lower crime rates help create:", options: ["A safer environment for economic activities", "More depletion", "Less market access", "More pollution"], a: 0, hint: "Businesses and workers benefit from safety." },
            { q: "Which factor affects agriculture and living conditions?", options: ["Climate change", "Ownership", "Financial systems", "Education"], a: 0, hint: "Changing climate conditions affect farms and settlements." },
            { q: "What disrupts development by damaging infrastructure?", options: ["Natural disasters", "Collaboration", "Gender equality", "Entrepreneurship"], a: 0, hint: "These events can destroy roads, buildings, and services." },
            { q: "What promotes sustainable development?", options: ["Environmental policies", "Crime rates", "Migration", "Resource depletion"], a: 0, hint: "Rules and plans can protect the environment." },
            { q: "Which factor supports agriculture and tourism?", options: ["Biodiversity", "Pollution", "Natural disasters", "Crime rates"], a: 0, hint: "A variety of living organisms benefits both sectors." },
            { q: "What harms health and deters investment?", options: ["Pollution", "Air quality", "Social stability", "Investment"], a: 0, hint: "Contaminated surroundings create costs and risks." },
            { q: "What is essential for health and industry?", options: ["Water availability", "Resource depletion", "Pollution", "Natural disasters"], a: 0, hint: "People and production both depend on it." },
            { q: "What reduces pollution and supports sustainability?", options: ["Waste management", "Migration", "Natural disasters", "Resource depletion"], a: 0, hint: "It deals responsibly with discarded materials." },
            { q: "Which approach emphasises community participation and leadership in local projects?", options: ["Community-based development", "Resource depletion", "Financial systems", "Migration"], a: 0, hint: "The community leads projects affecting its own life." },
            { q: "Which CBD aspect involves community members in decision-making?", options: ["Local participation", "Pollution", "Migration", "Trade"], a: 0, hint: "Projects should reflect local priorities and needs." },
            { q: "What builds people's capacity to control their own development?", options: ["Empowerment", "Natural disasters", "Crime rates", "Resource depletion"], a: 0, hint: "It strengthens individuals and groups." },
            { q: "Which CBD aspect uses local resources and knowledge for long-lasting outcomes?", options: ["Sustainability", "Pollution", "Migration", "Crime rates"], a: 0, hint: "The goal is an outcome that lasts." },
            { q: "What fosters partnerships with local organisations and external agencies?", options: ["Collaboration", "Resource depletion", "Natural disasters", "Crime rates"], a: 0, hint: "Partners combine resources and expertise." },
            { q: "Which aspect recognises that economic, social, and environmental issues interconnect?", options: ["Holistic approach", "Trade only", "Technology only", "Migration only"], a: 0, hint: "It considers the whole situation." },
            { q: "What gives communities responsibility for projects and improves maintenance?", options: ["Ownership", "Pollution", "Resource depletion", "Natural disasters"], a: 0, hint: "People care for projects they see as their own." }
        ];

        const prizes = [
            "R100", "R200", "R300", "R500", "R1,000",
            "R2,000", "R3,000", "R4,000", "R5,000", "R10,000",
            "R15,000", "R20,000", "R25,000", "R30,000", "R40,000",
            "R50,000", "R60,000", "R70,000", "R80,000", "R100,000",
            "R150,000", "R200,000", "R250,000", "R300,000", "R400,000",
            "R500,000", "R600,000", "R750,000", "R850,000", "R1,000,000"
        ];

        let currentLevel = 0;
        let isWaiting = false;

        const ladderContainer = document.getElementById('prizeLadder');
        for (let i = 0; i < 30; i++) {
            let step = document.createElement('div');
            step.className = 'ladder-step';
            step.id = `ladder-${i}`;
            if ((i + 1) % 5 === 0) step.classList.add('milestone');
            step.innerHTML = `<span>${i + 1}</span> <span>${prizes[i]}</span>`;
            ladderContainer.appendChild(step);
        }

        function loadQuestion() {
            isWaiting = false;
            document.querySelectorAll('.ladder-step').forEach((el, index) => {
                el.classList.remove('active');
                if (index < currentLevel) el.classList.add('passed');
            });
            document.getElementById(`ladder-${currentLevel}`).classList.add('active');

            const qData = questions[currentLevel];
            document.getElementById('questionText').innerText = `Q${currentLevel + 1}: ${qData.q}`;

            let options = [...qData.options];
            let correctText = options[qData.a];
            options.sort(() => Math.random() - 0.5);
            let correctIdx = options.indexOf(correctText);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn${i}`);
                btn.innerText = options[i];
                btn.className = 'answer-btn'; 
                btn.disabled = false;
                btn.classList.remove('hidden', 'selected', 'correct', 'incorrect');
                btn.setAttribute('data-correct', i === correctIdx);
            }
        }

        function selectAnswer(selectedIndex) {
            if (isWaiting) return;
            isWaiting = true;

            const selectedBtn = document.getElementById(`btn${selectedIndex}`);
            const isCorrect = selectedBtn.getAttribute('data-correct') === 'true';
            if (isCorrect) MayHubSounds.playCorrect();
            else MayHubSounds.playWrong();
            
            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).disabled = true;
            }

            selectedBtn.classList.add('selected');

            setTimeout(() => {
                selectedBtn.classList.remove('selected');

                if (isCorrect) {
                    selectedBtn.classList.add('correct');
                    setTimeout(() => {
                        currentLevel++;
                        if (currentLevel >= 30) endGame(true);
                        else loadQuestion();
                    }, 1000); 
                } else {
                    selectedBtn.classList.add('incorrect');
                    for (let i = 0; i < 4; i++) {
                        if (document.getElementById(`btn${i}`).getAttribute('data-correct') === 'true') {
                            document.getElementById(`btn${i}`).classList.add('correct');
                        }
                    }
                    setTimeout(() => endGame(false), 2000);
                }
            }, 1000);
        }

        function use5050() {
            if (isWaiting) return;
            document.getElementById('btn5050').disabled = true;
            let hiddenCount = 0;
            for(let i=0; i<4; i++){
                let btn = document.getElementById(`btn${i}`);
                if(btn.getAttribute('data-correct') === 'false' && hiddenCount < 2) {
                    btn.classList.add('hidden');
                    hiddenCount++;
                }
            }
        }

        function useHint() {
            if (isWaiting) return;
            document.getElementById('btnHint').disabled = true;
            alert("Geography Teacher Hint: " + questions[currentLevel].hint);
        }

        function endGame(won) {
            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            if (won) {
                document.getElementById('endMessage').innerText = "Geography Legend!";
                document.getElementById('endPrize').innerText = "R1,000,000";
            } else {
                document.getElementById('endMessage').innerText = "Final Winnings:";
                document.getElementById('endPrize').innerText = currentLevel > 0 ? prizes[currentLevel - 1] : "R0";
            }
        }
        loadQuestion();
    </script>
</body>
</html>
