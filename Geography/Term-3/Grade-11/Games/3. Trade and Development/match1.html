    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 11 Geography: Trade and Development</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Navigation */
        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }
        
        /* Header */
        .game-header { text-align: center; padding: 3rem 1rem 1rem; max-width: 900px; margin: 0 auto; }
        .game-title { color: #004080; font-size: 2.5rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 2rem; font-size: 1.1rem; }
        
        /* Categories */
        .category-selection { margin-bottom: 2.5rem; }
        .cat-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
        .cat-btn { background-color: #f0f4f8; border: 2px solid #004080; color: #004080; padding: 0.8rem 1.5rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .cat-btn:hover, .cat-btn.active { background-color: #004080; color: #fff; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,64,128,0.2); }

        .controls { display: none; justify-content: center; align-items: center; gap: 2rem; margin-bottom: 2rem; }
        .move-counter { font-size: 1.2rem; font-weight: bold; color: #004080; background: #fff; padding: 0.6rem 1.8rem; border-radius: 50px; border: 2px solid #3385ff; }
        .restart-btn { background-color: #3385ff; color: #fff; border: none; padding: 0.7rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; border-bottom: 3px solid #004080; }

        /* Memory Grid */
        .memory-game { display: none; width: 100%; max-width: 1200px; margin: 0 auto 4rem; grid-template-columns: repeat(5, 1fr); gap: 15px; padding: 0 20px; perspective: 1000px; }
        
        @media (max-width: 950px) { .memory-game { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 650px) { .memory-game { grid-template-columns: repeat(2, 1fr); } }

        .memory-card { position: relative; width: 100%; aspect-ratio: 1 / 1.2; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
        .memory-card.flip { transform: rotateY(180deg); }
        
        .front-face, .back-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 15px; 
            text-align: center; 
            font-size: 1rem; 
            line-height: 1.4; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .front-face { background: #004080; color: #fff; font-size: 2.5rem; border: 3px solid #3385ff; font-weight: bold; }
        .back-face { background: #fff; color: #002b5e; transform: rotateY(180deg); border: 3px solid #004080; font-weight: 700; }
        .memory-card.matched .back-face { background: #d4edda; border-color: #28a745; color: #155724; }

        footer { text-align: center; padding: 1.5rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>

<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">Grade 11 Geography: Trade and Development</h1>
        <p class="game-subtitle">Match the foundations, measures, policies, benefits, and challenges of international trade!</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Trade and Development - Grade 11 Geography Term 3 presentation.</p>
        
        <div class="category-selection">
            <div class="cat-buttons">
                <button class="cat-btn" onclick="selectCategory('topic1', this)">Trade Foundations</button>
                <button class="cat-btn" onclick="selectCategory('topic2', this)">Trade Measures</button>
                <button class="cat-btn" onclick="selectCategory('topic3', this)">Trade Policy</button>
                <button class="cat-btn" onclick="selectCategory('topic4', this)">Free Trade Advantages</button>
                <button class="cat-btn" onclick="selectCategory('topic5', this)">Free Trade Disadvantages</button>
                <button class="cat-btn" onclick="selectCategory('topic6', this)">Fair Trade</button>
            </div>
        </div>

        <div class="controls" id="gameControls">
            <div class="move-counter">Moves: <span id="moves">0</span></div>
            <button class="restart-btn" onclick="initGame()">Restart Level</button>
        </div>
    </header>

    <main class="memory-game" id="gameBoard"></main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const tradeFoundations = [
            { term: "Trade", detail: "The business of exchanging, selling, and distributing goods and services." },
            { term: "International Trade", detail: "The exchange of raw materials, goods, and services between buyers and sellers across country or territory borders." },
            { term: "Competitive Pricing", detail: "A pricing approach in which sellers set prices by considering the prices charged by competitors for similar goods or services." },
            { term: "Market", detail: "An organisation, place, or mechanism that brings buyers and sellers together to exchange goods and services." },
            { term: "Market Demand", detail: "The total quantity of a good or service that consumers in a market are willing and able to buy." },
            { term: "Commodities", detail: "Raw materials, such as crude oil, coffee, natural gas, gold, and wheat, used to manufacture goods." },
            { term: "Exports", detail: "Goods and services sold to buyers in other countries." },
            { term: "Imports", detail: "Goods and services bought from sellers in other countries." }
        ];
        const tradeMeasures = [
            { term: "Terms of Trade", detail: "The ratio between the prices of a country's exports and the prices of its imports." },
            { term: "Balance of Trade", detail: "The difference between the value of a country's exports and imports over a certain period." },
            { term: "Balance of Trade Formula", detail: "The calculation that subtracts the value of imports from the value of exports." },
            { term: "Trade Surplus", detail: "A favourable balance of trade in which the value of exports is higher than the value of imports." },
            { term: "Trade Deficit", detail: "An adverse balance of trade in which the value of imports is higher than the value of exports." },
            { term: "Balance of Payments", detail: "An accounting record of all transactions between a country and the rest of the world over a certain period." },
            { term: "Capital", detail: "Money and financial assets used for economic activity, including loans and investments." }
        ];
        const tradePolicy = [
            { term: "Trade Policy", detail: "A set of rules and standards that governs a country's trade with other countries." },
            { term: "Commercial Policy", detail: "Government rules and measures that regulate trade with other countries; another name for trade policy." },
            { term: "Protectionism", detail: "A policy of restricting international trade to protect locally produced goods and services from foreign competition." },
            { term: "Trade Barriers", detail: "Government regulations or policies that restrict international trade." },
            { term: "Tariffs", detail: "Taxes imposed on imported goods and services." },
            { term: "Quotas", detail: "Restrictions that limit the quantity of goods that may be imported from a country." },
            { term: "Subsidies", detail: "Benefits or financial assistance that a government gives to businesses or sectors of the economy." }
        ];
        const freeTradeAdvantages = [
            { term: "Economic Growth", detail: "An increase in the amount or value of goods and services produced by an economy over time." },
            { term: "Consumer Benefits", detail: "Advantages received by consumers, such as a wider variety of goods and lower prices." },
            { term: "Innovation", detail: "The development or introduction of new ideas, methods, products, or technologies." },
            { term: "Efficient Resource Allocation", detail: "The distribution of limited resources to the uses where they can produce the greatest value with the least waste." },
            { term: "Foreign Direct Investment", detail: "Investment by a person or business from one country in an enterprise located in another country." },
            { term: "Political Relations", detail: "The interactions and connections between governments or countries." },
            { term: "Specialisation", detail: "Concentrating production on goods or services in which a producer or country has an advantage." },
            { term: "Economies of Scale", detail: "Cost advantages gained when production increases and the average cost per unit falls." }
        ];
        const freeTradeDisadvantages = [
            { term: "Job Losses", detail: "A reduction in employment when workers lose their jobs or fewer positions are available." },
            { term: "Exploitation Risks", detail: "The possibility that workers or producers will be treated unfairly, for example through low wages or poor working conditions." },
            { term: "Economic Dependence", detail: "Reliance on other countries for goods, investment, income, or markets, creating economic vulnerability." },
            { term: "Environmental Impact", detail: "The effect that an activity has on the natural environment." },
            { term: "Market Volatility", detail: "The degree to which market prices or conditions change rapidly and unpredictably." },
            { term: "Loss of Sovereignty", detail: "A reduction in a country's ability to control its own decisions and economic policies." },
            { term: "Income Inequality", detail: "The unequal distribution of income among people or groups." },
            { term: "Cultural Erosion", detail: "The gradual weakening or loss of local traditions, values, and identities." }
        ];
        const fairTrade = [
            { term: "Free Trade", detail: "International trade without barriers or protective measures such as tariffs and quota restrictions." },
            { term: "Economic Integration", detail: "The process by which countries become more closely connected through trade and coordinated economic activity." },
            { term: "Fair Trade", detail: "A form of trade focused on sustainability, fair treatment of producers, and development in LEDCs." },
            { term: "Higher Producer Wages", detail: "Increased payment to the people who grow or manufacture goods." },
            { term: "Ending Exploitation", detail: "Stopping unfair practices that take advantage of workers or producers, including child labour." },
            { term: "Entrepreneurship", detail: "The process of identifying an opportunity, organising resources, and creating or managing an enterprise while accepting risk." }
        ];
        const toCards = factors => factors.flatMap((factor, index) => [
            { id: index + 1, text: factor.detail },
            { id: index + 1, text: factor.term }
        ]);
        const gameData = {
            topic1: toCards(tradeFoundations),
            topic2: toCards(tradeMeasures),
            topic3: toCards(tradePolicy),
            topic4: toCards(freeTradeAdvantages),
            topic5: toCards(freeTradeDisadvantages),
            topic6: toCards(fairTrade)
        };

        const gameBoard = document.getElementById('gameBoard');
        const movesDisplay = document.getElementById('moves');
        const gameControls = document.getElementById('gameControls');
        
        let currentCategory = null;
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;

        function selectCategory(categoryKey, btnElement) {
            currentCategory = categoryKey;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            gameControls.style.display = 'flex';
            gameBoard.style.display = 'grid';
            initGame();
        }

        function initGame() {
            gameBoard.innerHTML = '';
            moves = 0;
            matchedPairs = 0;
            movesDisplay.innerText = moves;
            hasFlippedCard = false;
            lockBoard = false;

            const categoryData = gameData[currentCategory];
            const shuffledCards = [...categoryData].sort(() => 0.5 - Math.random());

            shuffledCards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('memory-card');
                cardElement.dataset.pairId = card.id;
                
                cardElement.innerHTML = `
                    <div class="front-face">?</div>
                    <div class="back-face">${card.text}</div>
                `;
                
                cardElement.addEventListener('click', flipCard);
                gameBoard.appendChild(cardElement);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            movesDisplay.innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.pairId === secondCard.dataset.pairId;
            if (isMatch) {
                MayHubSounds.playCorrect();
                disableCards();
            } else {
                MayHubSounds.playWrong();
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matchedPairs++;
            if (matchedPairs === (gameData[currentCategory].length / 2)) {
                setTimeout(() => alert(`Great job! Grade 11 Geography: Trade and Development Revision Complete in ${moves} moves.`), 500);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1200);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }
    </script>
</body>
