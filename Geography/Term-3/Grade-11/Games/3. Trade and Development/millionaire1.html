<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 11 Geography: Trade and Development Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }
        
        .game-header { text-align: center; padding: 2rem 1rem 1rem; }
        .game-title { color: #004080; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 1.5rem; font-size: 1.1rem; }

        .game-wrapper { display: flex; max-width: 1100px; margin: 0 auto 3rem; gap: 2rem; padding: 0 20px; width: 100%; align-items: flex-start; }
        
        .game-board { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 6px solid #3385ff; padding: 2rem; display: flex; flex-direction: column; }
        
        .lifelines { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .lifeline-btn { background: #002b5e; color: #fff; border: 2px solid #b3d4ff; padding: 0.8rem 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .lifeline-btn:hover:not(:disabled) { background: #3385ff; transform: translateY(-2px); }
        .lifeline-btn:disabled { background: #ccc; border-color: #aaa; color: #666; cursor: not-allowed; transform: none; box-shadow: none; text-decoration: line-through; }

        .question-box { background: #004080; color: #fff; padding: 2rem; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 2rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .answer-btn { background: #f0f7ff; border: 2px solid #3385ff; color: #002b5e; padding: 1.2rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; position: relative; overflow: hidden; }
        .answer-btn::before { content: attr(data-letter) ": "; color: #3385ff; margin-right: 0.5rem; }
        .answer-btn:hover:not(:disabled) { background: #e6f0fa; border-color: #004080; transform: scale(1.02); }
        
        .answer-btn.selected { background: #ffc107; border-color: #d39e00; color: #000; }
        .answer-btn.correct { background: #28a745 !important; border-color: #1e7e34 !important; color: #fff !important; }
        .answer-btn.incorrect { background: #dc3545 !important; border-color: #bd2130 !important; color: #fff !important; }
        .answer-btn.hidden { visibility: hidden; }

        .prize-ladder { width: 280px; background: #001a33; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column-reverse; gap: 0.1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.2); max-height: 600px; overflow-y: auto; }
        .ladder-step { display: flex; justify-content: space-between; padding: 0.2rem 0.6rem; color: #66a3ff; font-weight: bold; border-radius: 4px; transition: all 0.3s; font-size: 0.85rem; }
        .ladder-step.active { background: #ffc107; color: #000; transform: scale(1.05); }
        .ladder-step.passed { color: #28a745; }
        .ladder-step.milestone { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.2); } 

        #endScreen { display: none; text-align: center; padding: 3rem 1rem; }
        #endMessage { font-size: 1.8rem; color: #004080; margin-bottom: 1rem; }
        #endPrize { font-size: 2.5rem; color: #28a745; font-weight: bold; margin-bottom: 2rem; }

        @media (max-width: 850px) {
            .game-wrapper { flex-direction: column; }
            .prize-ladder { width: 100%; flex-direction: row; flex-wrap: wrap; height: auto; } 
            .answers-grid { grid-template-columns: 1fr; }
        }
        
        footer { text-align: center; padding: 1rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">R1,000,000 Geography Challenge</h1>
        <p class="game-subtitle">Trade and Development (Grade 11 Term 3)</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Trade and Development - Grade 11 Geography Term 3 presentation.</p>
    </header>

    <main class="game-wrapper">
        <div class="game-board" id="gameBoard">
            <div class="lifelines">
                <button class="lifeline-btn" id="btn5050" onclick="use5050()">50 / 50</button>
                <button class="lifeline-btn" id="btnHint" onclick="useHint()">Get a Hint</button>
            </div>

            <div class="question-box">
                <span id="questionText">Loading question...</span>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-letter="A" id="btn0" onclick="selectAnswer(0)"></button>
                <button class="answer-btn" data-letter="B" id="btn1" onclick="selectAnswer(1)"></button>
                <button class="answer-btn" data-letter="C" id="btn2" onclick="selectAnswer(2)"></button>
                <button class="answer-btn" data-letter="D" id="btn3" onclick="selectAnswer(3)"></button>
            </div>
        </div>

        <div class="game-board" id="endScreen">
            <h2 id="endMessage">Game Over!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Your final winnings:</p>
            <div id="endPrize">R0</div>
            <button class="lifeline-btn" onclick="location.reload()">New Game</button>
        </div>

        <div class="prize-ladder" id="prizeLadder"></div>
    </main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const questions = [
            { q: "What is trade?", options: ["The exchange, sale, and distribution of goods and services", "Only the movement of money within a bank", "The production of raw materials only", "A restriction placed on imports"], a: 0, hint: "It involves exchanging, selling, and distributing." },
            { q: "When does trade become international trade?", options: ["When it happens in one town", "When goods or raw materials cross country borders", "When only services are exchanged", "When no market is involved"], a: 1, hint: "Look for an exchange across borders." },
            { q: "What can competition among companies selling similar goods do?", options: ["Remove consumer choice", "Stop all imports", "Drive consumer prices down", "Create a trade quota"], a: 2, hint: "Competing sellers try to attract buyers." },
            { q: "What does a market bring together?", options: ["Governments and tariffs", "Importers and quotas", "Loans and investments", "Buyers and sellers"], a: 3, hint: "It connects the two sides of an exchange." },
            { q: "What are commodities?", options: ["Raw materials used to manufacture consumer goods", "Taxes on imported products", "Records of international payments", "Limits on imported quantities"], a: 0, hint: "They are inputs used to make other products." },
            { q: "Which statement correctly distinguishes exports from imports?", options: ["Both are goods bought from other countries", "Exports are sold abroad; imports are bought from abroad", "Exports are tariffs; imports are quotas", "Exports are loans; imports are investments"], a: 1, hint: "One leaves the country for sale and the other enters it." },
            { q: "What do terms of trade compare?", options: ["Exports with capital", "Imports with subsidies", "Export prices with import prices", "Tariffs with quotas"], a: 2, hint: "It is a price ratio between two directions of trade." },
            { q: "What is the balance of trade?", options: ["A tax on imports", "A limit on imports", "A record of capital only", "The difference between export and import values over a period"], a: 3, hint: "Compare what a country sells abroad with what it buys." },
            { q: "Which formula calculates the balance of trade?", options: ["Value of exports minus value of imports", "Value of imports minus tariffs", "Capital plus quotas", "Exports plus imports"], a: 0, hint: "Start with the value earned from exports." },
            { q: "A country exports more than it imports. What does it have?", options: ["A trade barrier", "A trade surplus", "A trade deficit", "A quota"], a: 1, hint: "This is a favourable balance." },
            { q: "A country imports more than it exports. What does it have?", options: ["A subsidy", "A trade surplus", "A trade deficit", "Economic integration"], a: 2, hint: "This is an adverse balance." },
            { q: "What does the balance of payments record?", options: ["Only exported commodities", "Only taxes on imports", "Only loans from other countries", "All transactions between a country and the rest of the world"], a: 3, hint: "It is broader than the balance of trade." },
            { q: "Which items are examples of capital in the balance of payments?", options: ["Loans and investments", "Tariffs and quotas", "Exports and imports only", "Goods and services only"], a: 0, hint: "These are financial flows." },
            { q: "What is another name for trade policy?", options: ["Balance policy", "Commercial policy", "Market demand", "Fair pricing"], a: 1, hint: "The chapter gives these two terms as alternatives." },
            { q: "What is protectionism?", options: ["Removing every trade rule", "Recording all foreign transactions", "Restricting trade to support competition between imports and local goods", "Paying all producers the same wage"], a: 2, hint: "It protects local economic activity by restricting trade." },
            { q: "What are trade barriers?", options: ["Goods sold to another country", "Money invested abroad", "Raw materials used in manufacturing", "Policies or regulations that restrict international trade"], a: 3, hint: "They make cross-border trade more difficult." },
            { q: "What is a tariff?", options: ["A tax imposed on imported goods and services", "A limit on the number of goods imported", "A payment record", "A measure of export prices"], a: 0, hint: "It raises the cost of an imported item." },
            { q: "What is a quota?", options: ["A tax paid by exporters", "A limit on how many goods may be imported", "A government benefit to a sector", "A ratio of import and export prices"], a: 1, hint: "It controls quantity rather than price." },
            { q: "What is a subsidy?", options: ["A ban on all trade", "A record of services", "A government benefit given to a business or sector", "A type of imported commodity"], a: 2, hint: "Government assistance can support an industry." },
            { q: "Why may governments use subsidies?", options: ["To increase every import", "To remove local businesses", "To calculate terms of trade", "To help prevent industrial decline"], a: 3, hint: "The assistance supports vulnerable industries or sectors." },
            { q: "Under apartheid, South Africa used subsidies to encourage industries in which areas?", options: ["Border and homeland areas", "Only central business districts", "Foreign markets only", "Areas without workers"], a: 0, hint: "The presentation links the example to apartheid spatial policy." },
            { q: "What is free trade?", options: ["Trade controlled by higher tariffs", "Trade without barriers such as tariffs and quotas", "Trade involving commodities only", "Trade limited to one country"], a: 1, hint: "The barriers are lifted." },
            { q: "Lifting trade barriers encourages what process?", options: ["Industrial decline", "Trade isolation", "Economic integration", "A trade deficit in every country"], a: 2, hint: "Economies become more closely connected." },
            { q: "Which is an advantage of free trade for consumers?", options: ["Fewer goods at higher prices", "No access to foreign goods", "Guaranteed job losses", "A wider variety of goods at lower prices"], a: 3, hint: "Think about choice and price." },
            { q: "How can free trade encourage innovation?", options: ["Competition promotes technological advancement", "Quotas stop all new ideas", "Markets no longer need producers", "It ends the use of technology"], a: 0, hint: "Competition pushes firms to improve." },
            { q: "Which is a possible disadvantage of free trade?", options: ["All domestic industries expand", "Job losses in domestic industries", "Every worker earns more", "Countries become fully independent"], a: 1, hint: "Some local sectors may struggle against imports." },
            { q: "What risk comes from relying too heavily on foreign goods?", options: ["Economic integration", "Economies of scale", "Economic dependence", "A trade surplus"], a: 2, hint: "Over-reliance creates vulnerability." },
            { q: "How can free trade affect the environment?", options: ["It always ends pollution", "It removes all transport", "It guarantees conservation", "More production and transport may cause environmental degradation"], a: 3, hint: "Consider the effects of increased production and movement." },
            { q: "What is fair trade designed to promote?", options: ["Sustainability and development in LEDCs", "Higher barriers for every product", "Lower producer wages", "Greater child-labour exploitation"], a: 0, hint: "It focuses on fairer development outcomes." },
            { q: "Which group of actions reflects fair trade?", options: ["Lower wages, child labour, and fewer enterprises", "Higher producer wages, ending exploitation, and encouraging entrepreneurship", "More tariffs, quotas, and deficits", "Fewer markets, exports, and services"], a: 1, hint: "Fair trade aims to improve livelihoods and reduce exploitation." }
        ];

        const prizes = [
            "R100", "R200", "R300", "R500", "R1,000",
            "R2,000", "R3,000", "R4,000", "R5,000", "R10,000",
            "R15,000", "R20,000", "R25,000", "R30,000", "R40,000",
            "R50,000", "R60,000", "R70,000", "R80,000", "R100,000",
            "R150,000", "R200,000", "R250,000", "R300,000", "R400,000",
            "R500,000", "R600,000", "R750,000", "R850,000", "R1,000,000"
        ];

        let currentLevel = 0;
        let isWaiting = false;

        const ladderContainer = document.getElementById('prizeLadder');
        for (let i = 0; i < 30; i++) {
            let step = document.createElement('div');
            step.className = 'ladder-step';
            step.id = `ladder-${i}`;
            if ((i + 1) % 5 === 0) step.classList.add('milestone');
            step.innerHTML = `<span>${i + 1}</span> <span>${prizes[i]}</span>`;
            ladderContainer.appendChild(step);
        }

        function loadQuestion() {
            isWaiting = false;
            document.querySelectorAll('.ladder-step').forEach((el, index) => {
                el.classList.remove('active');
                if (index < currentLevel) el.classList.add('passed');
            });
            document.getElementById(`ladder-${currentLevel}`).classList.add('active');

            const qData = questions[currentLevel];
            document.getElementById('questionText').innerText = `Q${currentLevel + 1}: ${qData.q}`;

            let options = [...qData.options];
            let correctText = options[qData.a];
            options.sort(() => Math.random() - 0.5);
            let correctIdx = options.indexOf(correctText);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn${i}`);
                btn.innerText = options[i];
                btn.className = 'answer-btn'; 
                btn.disabled = false;
                btn.classList.remove('hidden', 'selected', 'correct', 'incorrect');
                btn.setAttribute('data-correct', i === correctIdx);
            }
        }

        function selectAnswer(selectedIndex) {
            if (isWaiting) return;
            isWaiting = true;

            const selectedBtn = document.getElementById(`btn${selectedIndex}`);
            const isCorrect = selectedBtn.getAttribute('data-correct') === 'true';
            if (isCorrect) MayHubSounds.playCorrect();
            else MayHubSounds.playWrong();
            
            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).disabled = true;
            }

            selectedBtn.classList.add('selected');

            setTimeout(() => {
                selectedBtn.classList.remove('selected');

                if (isCorrect) {
                    selectedBtn.classList.add('correct');
                    setTimeout(() => {
                        currentLevel++;
                        if (currentLevel >= 30) endGame(true);
                        else loadQuestion();
                    }, 1000); 
                } else {
                    selectedBtn.classList.add('incorrect');
                    for (let i = 0; i < 4; i++) {
                        if (document.getElementById(`btn${i}`).getAttribute('data-correct') === 'true') {
                            document.getElementById(`btn${i}`).classList.add('correct');
                        }
                    }
                    setTimeout(() => endGame(false), 2000);
                }
            }, 1000);
        }

        function use5050() {
            if (isWaiting) return;
            document.getElementById('btn5050').disabled = true;
            let hiddenCount = 0;
            for(let i=0; i<4; i++){
                let btn = document.getElementById(`btn${i}`);
                if(btn.getAttribute('data-correct') === 'false' && hiddenCount < 2) {
                    btn.classList.add('hidden');
                    hiddenCount++;
                }
            }
        }

        function useHint() {
            if (isWaiting) return;
            document.getElementById('btnHint').disabled = true;
            alert("Geography Teacher Hint: " + questions[currentLevel].hint);
        }

        function endGame(won) {
            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            if (won) {
                document.getElementById('endMessage').innerText = "Geography Legend!";
                document.getElementById('endPrize').innerText = "R1,000,000";
            } else {
                document.getElementById('endMessage').innerText = "Final Winnings:";
                document.getElementById('endPrize').innerText = currentLevel > 0 ? prizes[currentLevel - 1] : "R0";
            }
        }
        loadQuestion();
    </script>
</body>
</html>
