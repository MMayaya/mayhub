    <meta charset="UTF-8">

    <title>May Learning Hub | Grade 11 Geography: Globalisation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Navigation */
        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }
        
        /* Header */
        .game-header { text-align: center; padding: 3rem 1rem 1rem; max-width: 900px; margin: 0 auto; }
        .game-title { color: #004080; font-size: 2.5rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 2rem; font-size: 1.1rem; }
        
        /* Categories */
        .category-selection { margin-bottom: 2.5rem; }
        .cat-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
        .cat-btn { background-color: #f0f4f8; border: 2px solid #004080; color: #004080; padding: 0.8rem 1.5rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .cat-btn:hover, .cat-btn.active { background-color: #004080; color: #fff; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,64,128,0.2); }

        .controls { display: none; justify-content: center; align-items: center; gap: 2rem; margin-bottom: 2rem; }
        .move-counter { font-size: 1.2rem; font-weight: bold; color: #004080; background: #fff; padding: 0.6rem 1.8rem; border-radius: 50px; border: 2px solid #3385ff; }
        .restart-btn { background-color: #3385ff; color: #fff; border: none; padding: 0.7rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; border-bottom: 3px solid #004080; }

        /* Memory Grid */
        .memory-game { display: none; width: 100%; max-width: 1200px; margin: 0 auto 4rem; grid-template-columns: repeat(5, 1fr); gap: 15px; padding: 0 20px; perspective: 1000px; }
        
        @media (max-width: 950px) { .memory-game { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 650px) { .memory-game { grid-template-columns: repeat(2, 1fr); } }

        .memory-card { position: relative; width: 100%; aspect-ratio: 1 / 1.2; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
        .memory-card.flip { transform: rotateY(180deg); }
        
        .front-face, .back-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 15px; 
            text-align: center; 
            font-size: 1rem; 
            line-height: 1.4; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .front-face { background: #004080; color: #fff; font-size: 2.5rem; border: 3px solid #3385ff; font-weight: bold; }
        .back-face { background: #fff; color: #002b5e; transform: rotateY(180deg); border: 3px solid #004080; font-weight: 700; }
        .memory-card.matched .back-face { background: #d4edda; border-color: #28a745; color: #155724; }

        footer { text-align: center; padding: 1.5rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">Grade 11 Geography: Globalisation</h1>
        <p class="game-subtitle">Match the foundations, integration, benefits, challenges, and export-led development concepts of globalisation!</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Globalisation - Grade 11 Geography Term 3 presentation.</p>
        
        <div class="category-selection">
            <div class="cat-buttons">
                <button class="cat-btn" onclick="selectCategory('topic1', this)">Global Foundations</button>
                <button class="cat-btn" onclick="selectCategory('topic2', this)">Integration and MNCs</button>
                <button class="cat-btn" onclick="selectCategory('topic3', this)">Advantages</button>
                <button class="cat-btn" onclick="selectCategory('topic4', this)">Economic Challenges</button>
                <button class="cat-btn" onclick="selectCategory('topic5', this)">Social and Environmental Challenges</button>
                <button class="cat-btn" onclick="selectCategory('topic6', this)">Export-Led Development</button>
            </div>
        </div>

        <div class="controls" id="gameControls">
            <div class="move-counter">Moves: <span id="moves">0</span></div>
            <button class="restart-btn" onclick="initGame()">Restart Level</button>
        </div>
    </header>

    <main class="memory-game" id="gameBoard"></main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const foundations = [
            { term: "Globalisation", detail: "The process through which countries and people become increasingly socially, economically, culturally, and technologically interconnected." },
            { term: "Global Connections", detail: "Links that allow goods, services, information, ideas, and resources to move around the world." },
            { term: "Transport Systems", detail: "Networks and services used to move people and goods between places." },
            { term: "Telecommunication Systems", detail: "Technologies and networks that transmit information over distance." },
            { term: "Trade Barriers", detail: "Government regulations or policies that restrict international trade." },
            { term: "Global Village", detail: "A metaphor describing the world as a smaller, closely connected community." },
            { term: "Time-Space Barriers", detail: "Limits created by distance and delay that improved transport and communication reduce." },
            { term: "Cultural Exchange", detail: "The sharing of ideas, customs, beliefs, and practices between cultures." }
        ];
        const integration = [
            { term: "Economic Integration", detail: "The process by which national economies become more closely connected through freer movement of goods and services." },
            { term: "Multinational Corporation", detail: "A company that owns or controls business operations in more than one country." },
            { term: "MEDCs", detail: "More economically developed countries with relatively high income, industrialisation, and living standards." },
            { term: "LEDCs", detail: "Less economically developed countries with relatively lower income, industrialisation, and living standards." },
            { term: "Foreign Direct Investment", detail: "Investment by a person or company from one country in a business located in another country." },
            { term: "Economic Interdependence", detail: "A condition in which countries rely on one another for trade, investment, goods, services, or resources." },
            { term: "Global Trade Control", detail: "Influence over a large share of world trade, held mainly by MEDCs according to the presentation." }
        ];
        const advantages = [
            { term: "Economic Growth", detail: "An increase in the amount or value of goods and services produced by an economy over time." },
            { term: "Access to Technology", detail: "The ability to obtain and use technologies and innovations from across the world." },
            { term: "Improved Communication", detail: "Faster and easier worldwide exchange of information through communication technology." },
            { term: "Education Opportunities", detail: "Access to learning through global institutions, programmes, and connections." },
            { term: "Investment Opportunities", detail: "Chances to attract or make investments across national borders." },
            { term: "Innovation", detail: "The development or introduction of new ideas, methods, products, or technologies." },
            { term: "Improved Standards of Living", detail: "Better material well-being and quality of life." },
            { term: "Access to Goods and Services", detail: "The ability of consumers to obtain a wider variety of products and services." }
        ];
        const economicChallenges = [
            { term: "Economic Disparity", detail: "A difference in wealth and development between rich and poor countries or groups." },
            { term: "Outsourcing", detail: "Moving work or contracting business activities to an external provider, often in another country." },
            { term: "Labour Exploitation", detail: "Unfair treatment of workers through low wages, poor conditions, long hours, or child labour." },
            { term: "Economic Dependency", detail: "Reliance on foreign economies or multinational corporations that creates vulnerability." },
            { term: "Loss of Sovereignty", detail: "A reduction in national control over government decisions and economic policies." },
            { term: "Inequality", detail: "An uneven distribution of wealth, opportunities, or benefits." },
            { term: "Financial Instability", detail: "Economic disruption caused by rapid and unpredictable changes in financial markets." }
        ];
        const socialEnvironmental = [
            { term: "Cultural Homogenisation", detail: "The process through which cultures become increasingly similar, sometimes weakening local identity and traditions." },
            { term: "Loss of Jobs", detail: "A reduction in employment when work is outsourced or industries cannot compete." },
            { term: "Environmental Degradation", detail: "Damage to the natural environment caused by activities such as increased industrial production." },
            { term: "Cultural Clashes", detail: "Misunderstandings or conflicts caused by differences between interacting cultures." },
            { term: "Resource Exploitation", detail: "The intensive or unfair use of natural resources for economic gain." },
            { term: "Pollution", detail: "The introduction of harmful substances or energy into the environment." },
            { term: "Cultural Identity", detail: "The traditions, values, beliefs, and practices through which a group recognises itself." }
        ];
        const exports = [
            { term: "Export-Led Development", detail: "An approach that promotes development by supporting industries that produce goods or services for export." },
            { term: "Export Industry", detail: "An industry that produces goods or services for sale in other countries." },
            { term: "Infrastructure", detail: "The basic systems and facilities needed for economic activity and exports." },
            { term: "Technology Transfer", detail: "The movement of technical knowledge, skills, methods, or equipment between countries or organisations." },
            { term: "Trade-to-GDP Ratio", detail: "The value of international trade compared with the total value produced by an economy." },
            { term: "Capital Flows", detail: "Movements of money for investment, lending, or other financial purposes between countries." },
            { term: "Transfer Pricing", detail: "The pricing of transactions between related parts of a multinational corporation in different countries." }
        ];
        const toCards = factors => factors.flatMap((factor, index) => [
            { id: index + 1, text: factor.detail },
            { id: index + 1, text: factor.term }
        ]);
        const gameData = {
            topic1: toCards(foundations),
            topic2: toCards(integration),
            topic3: toCards(advantages),
            topic4: toCards(economicChallenges),
            topic5: toCards(socialEnvironmental),
            topic6: toCards(exports)
        };

        const gameBoard = document.getElementById('gameBoard');
        const movesDisplay = document.getElementById('moves');
        const gameControls = document.getElementById('gameControls');
        
        let currentCategory = null;
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;

        function selectCategory(categoryKey, btnElement) {
            currentCategory = categoryKey;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            gameControls.style.display = 'flex';
            gameBoard.style.display = 'grid';
            initGame();
        }

        function initGame() {
            gameBoard.innerHTML = '';
            moves = 0;
            matchedPairs = 0;
            movesDisplay.innerText = moves;
            hasFlippedCard = false;
            lockBoard = false;

            const categoryData = gameData[currentCategory];
            const shuffledCards = [...categoryData].sort(() => 0.5 - Math.random());

            shuffledCards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('memory-card');
                cardElement.dataset.pairId = card.id;
                
                cardElement.innerHTML = `
                    <div class="front-face">?</div>
                    <div class="back-face">${card.text}</div>
                `;
                
                cardElement.addEventListener('click', flipCard);
                gameBoard.appendChild(cardElement);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            movesDisplay.innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.pairId === secondCard.dataset.pairId;
            if (isMatch) {
                MayHubSounds.playCorrect();
                disableCards();
            } else {
                MayHubSounds.playWrong();
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matchedPairs++;
            if (matchedPairs === (gameData[currentCategory].length / 2)) {
                setTimeout(() => alert(`Great job! Grade 11 Geography: Globalisation Revision Complete in ${moves} moves.`), 500);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1200);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }
    </script>
</body>
</html>
