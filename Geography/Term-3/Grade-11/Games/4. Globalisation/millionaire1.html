<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 11 Geography: Globalisation Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }
        
        .game-header { text-align: center; padding: 2rem 1rem 1rem; }
        .game-title { color: #004080; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 1.5rem; font-size: 1.1rem; }

        .game-wrapper { display: flex; max-width: 1100px; margin: 0 auto 3rem; gap: 2rem; padding: 0 20px; width: 100%; align-items: flex-start; }
        
        .game-board { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 6px solid #3385ff; padding: 2rem; display: flex; flex-direction: column; }
        
        .lifelines { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .lifeline-btn { background: #002b5e; color: #fff; border: 2px solid #b3d4ff; padding: 0.8rem 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .lifeline-btn:hover:not(:disabled) { background: #3385ff; transform: translateY(-2px); }
        .lifeline-btn:disabled { background: #ccc; border-color: #aaa; color: #666; cursor: not-allowed; transform: none; box-shadow: none; text-decoration: line-through; }

        .question-box { background: #004080; color: #fff; padding: 2rem; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 2rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .answer-btn { background: #f0f7ff; border: 2px solid #3385ff; color: #002b5e; padding: 1.2rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; position: relative; overflow: hidden; }
        .answer-btn::before { content: attr(data-letter) ": "; color: #3385ff; margin-right: 0.5rem; }
        .answer-btn:hover:not(:disabled) { background: #e6f0fa; border-color: #004080; transform: scale(1.02); }
        
        .answer-btn.selected { background: #ffc107; border-color: #d39e00; color: #000; }
        .answer-btn.correct { background: #28a745 !important; border-color: #1e7e34 !important; color: #fff !important; }
        .answer-btn.incorrect { background: #dc3545 !important; border-color: #bd2130 !important; color: #fff !important; }
        .answer-btn.hidden { visibility: hidden; }

        .prize-ladder { width: 280px; background: #001a33; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column-reverse; gap: 0.1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.2); max-height: 600px; overflow-y: auto; }
        .ladder-step { display: flex; justify-content: space-between; padding: 0.2rem 0.6rem; color: #66a3ff; font-weight: bold; border-radius: 4px; transition: all 0.3s; font-size: 0.85rem; }
        .ladder-step.active { background: #ffc107; color: #000; transform: scale(1.05); }
        .ladder-step.passed { color: #28a745; }
        .ladder-step.milestone { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.2); } 

        #endScreen { display: none; text-align: center; padding: 3rem 1rem; }
        #endMessage { font-size: 1.8rem; color: #004080; margin-bottom: 1rem; }
        #endPrize { font-size: 2.5rem; color: #28a745; font-weight: bold; margin-bottom: 2rem; }

        @media (max-width: 850px) {
            .game-wrapper { flex-direction: column; }
            .prize-ladder { width: 100%; flex-direction: row; flex-wrap: wrap; height: auto; } 
            .answers-grid { grid-template-columns: 1fr; }
        }
        
        footer { text-align: center; padding: 1rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">R1,000,000 Geography Challenge</h1>
        <p class="game-subtitle">Globalisation (Grade 11 Term 3)</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Globalisation - Grade 11 Geography Term 3 presentation.</p>
    </header>

    <main class="game-wrapper">
        <div class="game-board" id="gameBoard">
            <div class="lifelines">
                <button class="lifeline-btn" id="btn5050" onclick="use5050()">50 / 50</button>
                <button class="lifeline-btn" id="btnHint" onclick="useHint()">Get a Hint</button>
            </div>

            <div class="question-box">
                <span id="questionText">Loading question...</span>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-letter="A" id="btn0" onclick="selectAnswer(0)"></button>
                <button class="answer-btn" data-letter="B" id="btn1" onclick="selectAnswer(1)"></button>
                <button class="answer-btn" data-letter="C" id="btn2" onclick="selectAnswer(2)"></button>
                <button class="answer-btn" data-letter="D" id="btn3" onclick="selectAnswer(3)"></button>
            </div>
        </div>

        <div class="game-board" id="endScreen">
            <h2 id="endMessage">Game Over!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Your final winnings:</p>
            <div id="endPrize">R0</div>
            <button class="lifeline-btn" onclick="location.reload()">New Game</button>
        </div>

        <div class="prize-ladder" id="prizeLadder"></div>
    </main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const questions = [
            { q: "What is globalisation?", options: ["A tax on imports", "Growing worldwide interconnection", "A local development project", "A ban on communication"], a: 1, hint: "Think about increasing links between countries and people." },
            { q: "Which improvements have increased global connections?", options: ["Reduced education and trade", "Higher time barriers", "Transport and telecommunications", "Fewer markets"], a: 2, hint: "They help people, goods, and information move." },
            { q: "What has globalisation generally done to international trade barriers?", options: ["Made every barrier permanent", "Replaced trade with aid", "Ended economic exchange", "Reduced them"], a: 3, hint: "Greater integration requires fewer restrictions." },
            { q: "What is the global village?", options: ["A metaphor for a smaller, connected world", "A single global government", "A rural settlement in every country", "A tariff-free port"], a: 0, hint: "It describes how distance feels less important." },
            { q: "Which barriers are being reduced by rapid global connection?", options: ["Relief and drainage", "Time and space", "Latitude and longitude", "Rainfall and temperature"], a: 1, hint: "Communication can happen immediately across great distances." },
            { q: "What is economic integration?", options: ["A cultural conflict", "A national trade ban", "Closer connection between national economies", "The loss of all industries"], a: 2, hint: "Goods and services move more freely between countries." },
            { q: "Economic integration requires the reduction or elimination of:", options: ["Communication systems", "Export industries", "Foreign investments", "Trade barriers"], a: 3, hint: "These restrict international exchange." },
            { q: "What is a multinational corporation?", options: ["A company operating in more than one country", "A local government office", "A trade barrier", "A cultural organisation only"], a: 0, hint: "Its business operations cross national borders." },
            { q: "Where are powerful MNCs predominantly based according to the presentation?", options: ["LEDCs only", "MEDCs", "Countries without trade", "Rural villages"], a: 1, hint: "These countries control most global trade." },
            { q: "What can powerful MNCs influence?", options: ["Climate zones", "Earth's rotation", "Government trade decisions", "Ocean currents"], a: 2, hint: "Their economic power can affect public policy." },
            { q: "Which advantage comes from access to a larger market?", options: ["Cultural erosion", "Job outsourcing", "Financial instability", "More trade and economic growth"], a: 3, hint: "More buyers can increase economic activity." },
            { q: "What is cultural exchange?", options: ["Sharing cultural ideas and practices", "Making all cultures identical", "Ending communication", "Moving a factory abroad"], a: 0, hint: "It involves cultures learning from one another." },
            { q: "Which benefit helps spread technology and innovation?", options: ["Economic disparity", "Access to technology", "Cultural clashes", "Labour exploitation"], a: 1, hint: "Knowledge and tools can move across borders." },
            { q: "How does improved communication support globalisation?", options: ["It increases time barriers", "It stops cultural exchange", "It connects people globally", "It ends trade"], a: 2, hint: "Communication technology links distant people." },
            { q: "How can global institutions and programmes benefit learners?", options: ["Reduce learning access", "End educational links", "Cause environmental damage", "Expand education opportunities"], a: 3, hint: "They create additional ways to study and collaborate." },
            { q: "What is foreign direct investment?", options: ["Foreign investment in a business in another country", "A tax on imported products", "A limit on imports", "A cultural exchange programme"], a: 0, hint: "A foreign investor puts capital into an overseas enterprise." },
            { q: "What encourages innovation under globalisation?", options: ["Isolation and secrecy", "Competition and collaboration", "Only trade barriers", "Cultural erosion"], a: 1, hint: "Firms compete while people and institutions share ideas." },
            { q: "How can economic interdependence support peace and security?", options: ["It removes every disagreement", "It ends all governments", "Connected economies have shared interests", "It prevents communication"], a: 2, hint: "Conflict can be costly when countries rely on each other." },
            { q: "What consumer benefit can globalisation provide?", options: ["Only one local product", "Higher time barriers", "No imports", "A wider variety of goods and services"], a: 3, hint: "Global markets broaden choice." },
            { q: "Which disadvantage can widen the gap between rich and poor nations?", options: ["Economic disparity", "Cultural exchange", "Education opportunities", "Technology transfer"], a: 0, hint: "Benefits are not distributed equally." },
            { q: "What is cultural homogenisation?", options: ["The protection of every local tradition", "Cultures becoming more alike and losing differences", "The movement of capital", "A government export programme"], a: 1, hint: "Global influences can weaken cultural identity." },
            { q: "Why may globalisation cause job losses in some countries?", options: ["All markets close", "Communication ends", "Jobs are outsourced to cheaper-labour countries", "Transport becomes slower"], a: 2, hint: "Companies may move work to reduce labour costs." },
            { q: "What may increased industrial activity cause?", options: ["Automatic conservation", "No pollution", "Lower resource use", "Environmental degradation"], a: 3, hint: "More production can damage the environment." },
            { q: "Which example describes labour exploitation?", options: ["Low wages, long hours, and child labour", "Improved education", "Higher living standards", "Wider consumer choice"], a: 0, hint: "Workers are treated unfairly." },
            { q: "What can over-reliance on foreign economies and MNCs create?", options: ["Full independence", "Economic dependency", "Cultural diversity only", "No vulnerability"], a: 1, hint: "The economy becomes vulnerable to outside decisions." },
            { q: "How may globalisation affect national sovereignty?", options: ["It guarantees complete control", "It removes foreign influence", "Governments may lose control over economic policy", "It ends capital flows"], a: 2, hint: "National independence may be reduced." },
            { q: "Why can corporation tax become harder to collect?", options: ["Countries stop using money", "Exports no longer exist", "Governments ban businesses", "MNCs can relocate or use transfer pricing"], a: 3, hint: "Companies can shift activity or reported profits across borders." },
            { q: "What is export-led development?", options: ["Development through industries producing for export", "A ban on exports", "A cultural integration programme", "A policy ending infrastructure"], a: 0, hint: "Exports are used to promote development and living standards." },
            { q: "What does government invest in under export-led development?", options: ["Cultural clashes", "Export industries and infrastructure", "Financial crises", "Trade barriers only"], a: 1, hint: "Producers need both support and facilities to reach foreign markets." },
            { q: "Which pair consists of South African export examples from the presentation?", options: ["Coffee and cocoa", "Phones and computers", "Outspan citrus and Sasol fuel", "Cotton and rubber"], a: 2, hint: "One is a food brand and the other is a fuel company." }
        ];

        const prizes = [
            "R100", "R200", "R300", "R500", "R1,000",
            "R2,000", "R3,000", "R4,000", "R5,000", "R10,000",
            "R15,000", "R20,000", "R25,000", "R30,000", "R40,000",
            "R50,000", "R60,000", "R70,000", "R80,000", "R100,000",
            "R150,000", "R200,000", "R250,000", "R300,000", "R400,000",
            "R500,000", "R600,000", "R750,000", "R850,000", "R1,000,000"
        ];

        let currentLevel = 0;
        let isWaiting = false;

        const ladderContainer = document.getElementById('prizeLadder');
        for (let i = 0; i < 30; i++) {
            let step = document.createElement('div');
            step.className = 'ladder-step';
            step.id = `ladder-${i}`;
            if ((i + 1) % 5 === 0) step.classList.add('milestone');
            step.innerHTML = `<span>${i + 1}</span> <span>${prizes[i]}</span>`;
            ladderContainer.appendChild(step);
        }

        function loadQuestion() {
            isWaiting = false;
            document.querySelectorAll('.ladder-step').forEach((el, index) => {
                el.classList.remove('active');
                if (index < currentLevel) el.classList.add('passed');
            });
            document.getElementById(`ladder-${currentLevel}`).classList.add('active');

            const qData = questions[currentLevel];
            document.getElementById('questionText').innerText = `Q${currentLevel + 1}: ${qData.q}`;

            let options = [...qData.options];
            let correctText = options[qData.a];
            options.sort(() => Math.random() - 0.5);
            let correctIdx = options.indexOf(correctText);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn${i}`);
                btn.innerText = options[i];
                btn.className = 'answer-btn'; 
                btn.disabled = false;
                btn.classList.remove('hidden', 'selected', 'correct', 'incorrect');
                btn.setAttribute('data-correct', i === correctIdx);
            }
        }

        function selectAnswer(selectedIndex) {
            if (isWaiting) return;
            isWaiting = true;

            const selectedBtn = document.getElementById(`btn${selectedIndex}`);
            const isCorrect = selectedBtn.getAttribute('data-correct') === 'true';
            if (isCorrect) MayHubSounds.playCorrect();
            else MayHubSounds.playWrong();
            
            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).disabled = true;
            }

            selectedBtn.classList.add('selected');

            setTimeout(() => {
                selectedBtn.classList.remove('selected');

                if (isCorrect) {
                    selectedBtn.classList.add('correct');
                    setTimeout(() => {
                        currentLevel++;
                        if (currentLevel >= 30) endGame(true);
                        else loadQuestion();
                    }, 1000); 
                } else {
                    selectedBtn.classList.add('incorrect');
                    for (let i = 0; i < 4; i++) {
                        if (document.getElementById(`btn${i}`).getAttribute('data-correct') === 'true') {
                            document.getElementById(`btn${i}`).classList.add('correct');
                        }
                    }
                    setTimeout(() => endGame(false), 2000);
                }
            }, 1000);
        }

        function use5050() {
            if (isWaiting) return;
            document.getElementById('btn5050').disabled = true;
            let hiddenCount = 0;
            for(let i=0; i<4; i++){
                let btn = document.getElementById(`btn${i}`);
                if(btn.getAttribute('data-correct') === 'false' && hiddenCount < 2) {
                    btn.classList.add('hidden');
                    hiddenCount++;
                }
            }
        }

        function useHint() {
            if (isWaiting) return;
            document.getElementById('btnHint').disabled = true;
            alert("Geography Teacher Hint: " + questions[currentLevel].hint);
        }

        function endGame(won) {
            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            if (won) {
                document.getElementById('endMessage').innerText = "Geography Legend!";
                document.getElementById('endPrize').innerText = "R1,000,000";
            } else {
                document.getElementById('endMessage').innerText = "Final Winnings:";
                document.getElementById('endPrize').innerText = currentLevel > 0 ? prizes[currentLevel - 1] : "R0";
            }
        }
        loadQuestion();
    </script>
</body>
</html>
