<style>
  :root {
    --belt-height: 64px;
    --belt-navy: #07356f;
    --belt-navy-deep: #042854;
    --belt-blue: #2f8cff;
    --belt-text: #dceaff;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    background: #dcdee0;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  .mayhub-belt {
    position: relative;
    z-index: 1000;
    flex: 0 0 var(--belt-height);
    height: var(--belt-height);
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 clamp(18px, 3vw, 42px);
    color: white;
    background: linear-gradient(105deg, var(--belt-navy-deep) 0%, var(--belt-navy) 58%, #08427f 100%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 4px 18px rgba(2, 25, 55, 0.22);
  }

  .mayhub-brand {
    flex: 0 0 auto;
    color: #fff;
    font-size: clamp(18px, 1.35vw, 23px);
    font-weight: 750;
    letter-spacing: -0.02em;
    text-decoration: none;
    white-space: nowrap;
  }

  .mayhub-brand:focus-visible,
  .mayhub-link:focus-visible,
  .mayhub-menu-button:focus-visible {
    outline: 3px solid #8fc5ff;
    outline-offset: 3px;
  }

  .mayhub-nav {
    min-width: 0;
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
  }

  .mayhub-link {
    display: inline-flex;
    align-items: center;
    min-height: 40px;
    padding: 0 13px;
    border-radius: 8px;
    color: var(--belt-text);
    font-size: 14px;
    font-weight: 650;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    transition: color 160ms ease, background-color 160ms ease, transform 160ms ease;
  }

  .mayhub-link:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-1px);
  }

  .mayhub-link.resource-link {
    color: #fff;
    background: rgba(47, 140, 255, 0.2);
    border: 1px solid rgba(143, 197, 255, 0.28);
  }

  .mayhub-link.resource-link:hover {
    background: var(--belt-blue);
    border-color: var(--belt-blue);
  }

  .mayhub-divider {
    width: 1px;
    height: 26px;
    margin: 0 4px;
    background: rgba(255, 255, 255, 0.18);
  }

  .mayhub-menu-button {
    display: none;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    padding: 0 12px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 8px;
    color: #fff;
    background: rgba(255, 255, 255, 0.09);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .menu-lines,
  .menu-lines::before,
  .menu-lines::after {
    width: 17px;
    height: 2px;
    display: block;
    border-radius: 2px;
    background: currentColor;
  }

  .menu-lines { position: relative; }
  .menu-lines::before,
  .menu-lines::after { content: ""; position: absolute; left: 0; }
  .menu-lines::before { top: -5px; }
  .menu-lines::after { top: 5px; }

  .presentation-stage {
    position: relative;
    min-height: 0;
    flex: 1 1 auto;
    overflow: hidden;
    background: #dcdee0;
  }

  .presentation-frame {
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
    background: #dcdee0;
  }

  @media (max-width: 1120px) {
    :root { --belt-height: 58px; }

    .mayhub-belt {
      gap: 14px;
      padding-inline: 16px;
    }

    .mayhub-menu-button { display: inline-flex; margin-left: auto; }

    .mayhub-nav {
      position: absolute;
      top: calc(100% + 8px);
      right: 14px;
      width: min(340px, calc(100vw - 28px));
      max-height: calc(100vh - var(--belt-height) - 24px);
      overflow-y: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(4, 40, 84, 0.98);
      box-shadow: 0 18px 42px rgba(0, 16, 40, 0.34);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
    }

    .mayhub-nav[data-open="true"] {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .mayhub-link {
      width: 100%;
      justify-content: flex-start;
      padding-inline: 14px;
    }

    .mayhub-divider {
      width: 100%;
      height: 1px;
      margin: 5px 0;
    }
  }

  @media (max-width: 420px) {
    .mayhub-brand { font-size: 17px; }
    .mayhub-menu-button { padding-inline: 10px; }
    .menu-label { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mayhub-link,
    .mayhub-nav { transition: none; }
  }
</style>

<body>
<header class="mayhub-belt">
  <a class="mayhub-brand" href="../../../../index.html" aria-label="May Learning Hub home">May Learning Hub</a>
  <button class="mayhub-menu-button" id="mayhubMenuButton" type="button" aria-expanded="false" aria-controls="mayhubPresentationNav">
    <span class="menu-label">Explore</span>
    <span class="menu-lines" aria-hidden="true"></span>
  </button>
  <nav class="mayhub-nav" id="mayhubPresentationNav" aria-label="May Learning Hub presentation navigation" data-open="false">
    <a class="mayhub-link" href="../../../../index.html">Home</a>
    <a class="mayhub-link" href="../../../../about.html">About</a>
    <a class="mayhub-link" href="../../../../suppdown.html">Support &amp; Downloads</a>
    <span class="mayhub-divider" aria-hidden="true"></span>
    <a class="mayhub-link resource-link" href="../Games/games.html">Games</a>
    <a class="mayhub-link resource-link" href="../Activities/activities.html">Activities</a>
    <a class="mayhub-link resource-link" href="../../../../index.html#details-Geography-grade-11-term-3-guides">Learning Guides</a>
  </nav>
</header>
<main class="presentation-stage">
  <iframe
    class="presentation-frame"
    src="data/presentation-player.html"
    title="Grade 11 Geography Term 3 presentation player"
    allow="autoplay; fullscreen"
    allowfullscreen
  ></iframe>
</main>
<script>
(function () {
  const button = document.getElementById('mayhubMenuButton');
  const nav = document.getElementById('mayhubPresentationNav');
  if (!button || !nav) return;

  function setMenu(open) {
    nav.dataset.open = String(open);
    button.setAttribute('aria-expanded', String(open));
  }

  button.addEventListener('click', function () {
    setMenu(nav.dataset.open !== 'true');
  });

  nav.addEventListener('click', function (event) {
    if (event.target.closest('a')) setMenu(false);
  });

  document.addEventListener('click', function (event) {
    if (!event.target.closest('.mayhub-belt')) setMenu(false);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      setMenu(false);
      button.focus();
    }
  });

  window.addEventListener('resize', function () {
    if (window.innerWidth > 1120) setMenu(false);
  });
})();
</script>
</body>
