    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 10 Geography: Population Structure</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Navigation */
        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }
        
        /* Header */
        .game-header { text-align: center; padding: 3rem 1rem 1rem; max-width: 900px; margin: 0 auto; }
        .game-title { color: #004080; font-size: 2.5rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 2rem; font-size: 1.1rem; }
        
        /* Categories */
        .category-selection { margin-bottom: 2.5rem; }
        .cat-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
        .cat-btn { background-color: #f0f4f8; border: 2px solid #004080; color: #004080; padding: 0.8rem 1.5rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .cat-btn:hover, .cat-btn.active { background-color: #004080; color: #fff; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,64,128,0.2); }

        .controls { display: none; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
        .stat-pill { min-width: 126px; font-size: 1rem; font-weight: bold; color: #004080; background: #fff; padding: 0.55rem 1rem; border-radius: 50px; border: 2px solid #3385ff; }
        .restart-btn { background-color: #3385ff; color: #fff; border: none; padding: 0.7rem 1.8rem; font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer; border-bottom: 3px solid #004080; }
        .mastery-status { display: none; max-width: 760px; margin: 0 auto 1.4rem; padding: 0.75rem 1rem; border-radius: 12px; background: #fff; border: 1px solid #b8d4f2; color: #173b63; font-weight: 650; }

        /* Memory Grid */
        .memory-game { display: none; width: 100%; max-width: 1200px; margin: 0 auto 4rem; grid-template-columns: repeat(5, 1fr); gap: 15px; padding: 0 20px; perspective: 1000px; }
        
        @media (max-width: 950px) { .memory-game { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 650px) {
            .memory-game { grid-template-columns: repeat(2, 1fr); }
            .controls { gap: 0.5rem; }
            .stat-pill { min-width: 102px; padding: 0.45rem 0.7rem; font-size: 0.9rem; }
            .restart-btn { padding: 0.58rem 1rem; font-size: 0.9rem; }
        }

        .memory-card { position: relative; width: 100%; aspect-ratio: 1 / 1.2; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
        .memory-card.flip { transform: rotateY(180deg); }
        
        .front-face, .back-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 15px; 
            text-align: center; 
            font-size: 1rem; 
            line-height: 1.4; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .front-face { background: #004080; color: #fff; font-size: 2.5rem; border: 3px solid #3385ff; font-weight: bold; }
        .back-face { background: #fff; color: #002b5e; transform: rotateY(180deg); border: 3px solid #004080; font-weight: 700; }
        .memory-card.matched .back-face { background: #d4edda; border-color: #28a745; color: #155724; }

        footer { text-align: center; padding: 1.5rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>

<body data-certificate-grade="Grade 10" data-certificate-subject="Geography" data-certificate-term="Term 3" data-certificate-topic="Population Structure" data-certificate-game="Population Structure Memory Game" data-certificate-layout="compact-subject" data-certificate-preview-preset="memory-mastery" data-certificate-metric-style="split-duration">

    <nav>
        <a href="../../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../../index.html">Home</a>
            <a href="../../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">Grade 10 Geography: Population Structure</h1>
        <p class="game-subtitle">Revise population pyramids, age groups, life expectancy, and government planning.</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Grade 10 Geography Term 3 revision</p>
        
        <div class="category-selection">
            <div class="cat-buttons">
                <button class="cat-btn" onclick="selectCategory('topic1', this)">Assessment Review - 10 Pairs</button>
            </div>
        </div>

        <div class="controls" id="gameControls">
            <div class="stat-pill">Time: <span id="elapsedTime">00:00</span></div>
            <div class="stat-pill">Moves: <span id="moves">0</span></div>
            <div class="stat-pill">Best: <span id="bestTime">--</span></div>
            <button class="restart-btn" onclick="initGame()">Restart Level</button>
        </div>
        <div class="mastery-status" id="masteryStatus" role="status" aria-live="polite"></div>
    </header>

    <main class="memory-game" id="gameBoard"></main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../../game-audio.js"></script>
        <script src="../../../../../../may-certificate-renderer.js"></script>
        <script src="../../../../../../may-certificate-actions.js"></script>
        <script src="../../../../../../assessment-certificate.js"></script>
<script>
        const gameData = {
    "topic1": [
        {
            "id": 1,
            "text": "What graph displays age groups on the vertical axis and population by sex on opposite sides?"
        },
        {
            "id": 1,
            "text": "Population pyramid"
        },
        {
            "id": 2,
            "text": "A pyramid has a very broad base and narrows quickly upward. Is it typical of a developing or developed country?"
        },
        {
            "id": 2,
            "text": "A developing country"
        },
        {
            "id": 3,
            "text": "What does a broad pyramid base normally indicate?"
        },
        {
            "id": 3,
            "text": "A high birth rate and a large youthful population"
        },
        {
            "id": 4,
            "text": "What does a very narrow pyramid apex normally indicate?"
        },
        {
            "id": 4,
            "text": "Few elderly people and relatively low life expectancy"
        },
        {
            "id": 5,
            "text": "Which population group is represented by the youngest bars?"
        },
        {
            "id": 5,
            "text": "Young dependants"
        },
        {
            "id": 6,
            "text": "Which group normally supplies most of the labour force?"
        },
        {
            "id": 6,
            "text": "Working-age population"
        },
        {
            "id": 7,
            "text": "In a population pyramid, which group is represented by the oldest age bars?"
        },
        {
            "id": 7,
            "text": "Elderly dependants"
        },
        {
            "id": 8,
            "text": "Why does a youthful population create demand for schools?"
        },
        {
            "id": 8,
            "text": "Many children require classrooms, teachers and learning materials"
        },
        {
            "id": 9,
            "text": "Give one health-related reason for low life expectancy."
        },
        {
            "id": 9,
            "text": "Poor healthcare, disease, malnutrition or unsafe water"
        },
        {
            "id": 10,
            "text": "How can pyramid data help government plan healthcare?"
        },
        {
            "id": 10,
            "text": "It shows the age groups and likely health services required"
        }
    ]
};

        const gameBoard = document.getElementById('gameBoard');
        const movesDisplay = document.getElementById('moves');
        const elapsedTimeDisplay = document.getElementById('elapsedTime');
        const bestTimeDisplay = document.getElementById('bestTime');
        const masteryStatus = document.getElementById('masteryStatus');
        const gameControls = document.getElementById('gameControls');
        
        let currentCategory = null;
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;
        let timerStarted = false;
        let gameCompleted = false;
        let activeStartedAt = null;
        let accumulatedTime = 0;
        let timerInterval = null;

        const masteryAwards = [
            {
                maxTime: 90000,
                maxMoves: 18,
                className: 'tier-platinum',
                label: 'Platinum Rapid Recall Award',
                shortLabel: 'Platinum – Rapid Recall',
                message: 'RAPID RECALL — Exceptional focus, memory and matching efficiency.'
            },
            {
                maxTime: 150000,
                maxMoves: 24,
                className: 'tier-gold',
                label: 'Gold Excellent Recall Award',
                shortLabel: 'Gold – Excellent Recall',
                message: 'EXCELLENT RECALL — Impressive concentration and memory performance.'
            },
            {
                maxTime: 240000,
                maxMoves: 34,
                className: 'tier-silver',
                label: 'Silver Strong Recall Award',
                shortLabel: 'Silver – Strong Recall',
                message: 'STRONG RECALL — A focused and thoughtful memory performance.'
            },
            {
                maxTime: Infinity,
                maxMoves: Infinity,
                className: 'tier-bronze',
                label: 'Bronze Determined Recall Award',
                shortLabel: 'Bronze – Determined Recall',
                message: 'DETERMINED RECALL — Persistence and concentration completed the challenge.'
            }
        ];

        function getLearnerId() {
            for (const storage of [window.localStorage, window.sessionStorage]) {
                try {
                    const saved = JSON.parse(storage.getItem('mayhubActivityAccess') || 'null');
                    const identity = saved?.uid || saved?.email;
                    if (identity) return String(identity);
                } catch {}
            }
            return 'guest';
        }

        function storageKeyPart(value) {
            return encodeURIComponent(String(value || 'unknown').trim().toLowerCase().replace(/\s+/g, '-'));
        }

        function bestTimeStorageKey() {
            const metadata = document.body.dataset;
            const gameKey = [
                metadata.certificateGrade,
                metadata.certificateSubject,
                metadata.certificateTerm,
                metadata.certificateTopic,
                metadata.certificateGame
            ].map(storageKeyPart).join(':');
            return 'mayhubMemoryMasteryBest:v1:' + gameKey + ':' + encodeURIComponent(getLearnerId());
        }

        function memoryChallengeTitle() {
            const topic = document.body.dataset.certificateTopic || 'Assessment';
            return topic + ' Memory Match Challenge';
        }

        function readBestTime() {
            try {
                const saved = JSON.parse(window.localStorage.getItem(bestTimeStorageKey()) || 'null');
                return saved && Number.isFinite(saved.elapsedMs) ? saved : null;
            } catch {
                return null;
            }
        }

        function saveBestTime(elapsedMs, completedMoves) {
            const previous = readBestTime();
            const isNewBest = !previous || elapsedMs < previous.elapsedMs;
            if (isNewBest) {
                try {
                    window.localStorage.setItem(bestTimeStorageKey(), JSON.stringify({
                        elapsedMs,
                        moves: completedMoves,
                        achievedAt: new Date().toISOString()
                    }));
                } catch {}
            }
            return isNewBest;
        }

        function formatClock(milliseconds) {
            const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        function formatDuration(milliseconds) {
            const totalSeconds = Math.max(1, Math.round(milliseconds / 1000));
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const parts = [];
            if (minutes) parts.push(minutes + ' minute' + (minutes === 1 ? '' : 's'));
            if (seconds || !minutes) parts.push(seconds + ' second' + (seconds === 1 ? '' : 's'));
            return parts.join(' ');
        }

        function currentElapsedTime() {
            return accumulatedTime + (activeStartedAt === null ? 0 : performance.now() - activeStartedAt);
        }

        function updateTimerDisplay() {
            elapsedTimeDisplay.innerText = formatClock(currentElapsedTime());
        }

        function resumeTimer() {
            if (!timerStarted || gameCompleted || document.hidden || activeStartedAt !== null) return;
            activeStartedAt = performance.now();
        }

        function pauseTimer() {
            if (activeStartedAt === null) return;
            accumulatedTime += performance.now() - activeStartedAt;
            activeStartedAt = null;
            updateTimerDisplay();
        }

        function startTimer() {
            if (timerStarted) return;
            timerStarted = true;
            resumeTimer();
            timerInterval = window.setInterval(updateTimerDisplay, 250);
        }

        function stopTimer() {
            pauseTimer();
            if (timerInterval) window.clearInterval(timerInterval);
            timerInterval = null;
            return accumulatedTime;
        }

        function calculateMasteryAward(elapsedMs, completedMoves) {
            return masteryAwards.find(award => elapsedMs <= award.maxTime && completedMoves <= award.maxMoves)
                || masteryAwards[masteryAwards.length - 1];
        }

        function nextAwardMessage(award) {
            if (award.className === 'tier-platinum') return 'Top level achieved — replay to improve your personal best.';
            if (award.className === 'tier-gold') return 'Next target: Platinum within 01:30 and 18 moves.';
            if (award.className === 'tier-silver') return 'Next target: Gold within 02:30 and 24 moves.';
            return 'Next target: Silver within 04:00 and 34 moves.';
        }

        function renderBestTime() {
            const best = readBestTime();
            bestTimeDisplay.innerText = best ? formatClock(best.elapsedMs) : '--';
        }

        function selectCategory(categoryKey, btnElement) {
            currentCategory = categoryKey;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            gameControls.style.display = 'flex';
            gameBoard.style.display = 'grid';
            initGame();
        }

        function initGame() {
            if (timerInterval) window.clearInterval(timerInterval);
            gameBoard.innerHTML = '';
            moves = 0;
            matchedPairs = 0;
            timerStarted = false;
            gameCompleted = false;
            activeStartedAt = null;
            accumulatedTime = 0;
            timerInterval = null;
            movesDisplay.innerText = moves;
            elapsedTimeDisplay.innerText = '00:00';
            masteryStatus.style.display = 'none';
            masteryStatus.textContent = '';
            renderBestTime();
            hasFlippedCard = false;
            lockBoard = false;

            const categoryData = gameData[currentCategory];
            const shuffledCards = [...categoryData].sort(() => 0.5 - Math.random());

            shuffledCards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('memory-card');
                cardElement.dataset.pairId = card.id;
                
                cardElement.innerHTML = `
                    <div class="front-face">?</div>
                    <div class="back-face">${card.text}</div>
                `;
                
                cardElement.addEventListener('click', flipCard);
                gameBoard.appendChild(cardElement);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            startTimer();

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            movesDisplay.innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.pairId === secondCard.dataset.pairId;
            if (isMatch) {
                MayHubSounds.playCorrect();
                disableCards();
            } else {
                MayHubSounds.playWrong();
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matchedPairs++;
            if (matchedPairs === (gameData[currentCategory].length / 2)) {
                gameCompleted = true;
                const elapsedMs = stopTimer();
                const award = calculateMasteryAward(elapsedMs, moves);
                const isNewBest = saveBestTime(elapsedMs, moves);
                const duration = formatDuration(elapsedMs);
                renderBestTime();
                masteryStatus.style.display = 'block';
                masteryStatus.textContent = award.shortLabel + ' • ' + duration + ' • ' + moves + ' moves. '
                    + (isNewBest ? 'New personal best! ' : '') + nextAwardMessage(award);
                setTimeout(() => {
                    MayHubCertificates.showParticipation({
                        gameTitle: memoryChallengeTitle(),
                        category: '10-Pair Memory Match',
                        certificateTitle: 'Certificate of Memory Mastery',
                        awardLabel: award.label,
                        tierClass: award.className,
                        metricLabel: 'Completed in',
                        metricValue: formatClock(elapsedMs),
                        metricStyle: document.body.dataset.certificateMetricStyle || '',
                        message: award.message,
                        onReplay: initGame
                    });
                }, 500);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1200);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) pauseTimer();
            else resumeTimer();
        });
    </script>
</body>
