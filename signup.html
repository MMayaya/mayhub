<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8GCWSKNDL7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-8GCWSKNDL7');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | May Learning Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .auth-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .auth-card h2 {
            color: #0056ff; /* Vibrant Blue */
            text-shadow: 0 0 10px rgba(0, 86, 255, 0.2);
            margin-bottom: 1rem;
        }

        .name-row {
            display: flex;
            gap: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #0056ff;
            box-shadow: 0 0 5px rgba(0, 86, 255, 0.2);
        }

        select:disabled, input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
            color: #999;
        }

        .subject-group {
            text-align: left;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fafafa;
        }

        .subject-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #555;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .checkbox-item input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        /* Vibrant Glowy Blue Button */
        .btn-primary {
            background: linear-gradient(135deg, #0056ff, #00d4ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }
        
        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
            transform: translateY(-1px);
        }
        
        .btn-primary:disabled { 
            background: #a1c4f4; 
            box-shadow: none;
            cursor: not-allowed; 
        }

        .hidden {
            display: none;
        }
        
        #status-message { 
            margin-top: 12px; 
            font-size: 0.9rem; 
            color: #cc0000; 
            font-weight: 600; 
        }
        
        .link-text {
            color: #0072ff; 
            text-decoration: none;
            font-weight: 600;
        }
        
        .link-text:hover {
            text-decoration: underline;
            text-shadow: 0 0 8px rgba(0, 114, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>Join May Learning Hub</h2>
    <p>Create your profile to get started</p>
    
    <div class="name-row">
        <input type="text" id="firstName" placeholder="First Name">
        <input type="text" id="lastName" placeholder="Surname">
    </div>
    
    <input type="email" id="email" placeholder="Email Address">
    <input type="tel" id="phone" placeholder="Contact Number (Optional)">
    
    <select id="province">
        <option value="" disabled selected>Select Your Province</option>
        <option value="Eastern Cape">Eastern Cape</option>
        <option value="Free State">Free State</option>
        <option value="Gauteng">Gauteng</option>
        <option value="KwaZulu-Natal">KwaZulu-Natal</option>
        <option value="Limpopo">Limpopo</option>
        <option value="Mpumalanga">Mpumalanga</option>
        <option value="Northern Cape">Northern Cape</option>
        <option value="North West">North West</option>
        <option value="Western Cape">Western Cape</option>
    </select>

    <select id="district" disabled>
        <option value="" disabled selected>Select Province First</option>
    </select>

    <input type="text" id="school" list="school-list" placeholder="Start typing school name..." disabled autocomplete="off">
    <datalist id="school-list">
        </datalist>
    <input type="password" id="password" placeholder="Password (min. 6 characters)">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    
    <select id="role">
        <option value="" disabled selected>I am a...</option>
        <option value="learner">Learner</option>
        <option value="teacher">Teacher</option>
    </select>

    <div id="learnerSection" class="hidden">
        <select id="grade">
            <option value="" disabled selected>Select Your Grade</option>
            <option value="8">Grade 8</option>
            <option value="9">Grade 9</option>
            <option value="10">Grade 10</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
        </select>

        <div id="learnerSubjects" class="subject-group hidden">
            <label>Select Subjects:</label>
            <div class="checkbox-item"><input type="checkbox" class="l-sub" value="Geography"> Geography</div>
            <div class="checkbox-item"><input type="checkbox" class="l-sub" value="Life Sciences"> Life Sciences</div>
        </div>
    </div>

    <div id="teacherSection" class="subject-group hidden">
        <label>Subjects You Teach (Select all that apply):</label>
        <div class="checkbox-item"><input type="checkbox" class="t-sub" value="Social Sciences"> Social Sciences</div>
        <div class="checkbox-item"><input type="checkbox" class="t-sub" value="Geography"> Geography</div>
        <div class="checkbox-item"><input type="checkbox" class="t-sub" value="Life Sciences"> Life Sciences</div>
    </div>

    <button id="emailSignup" class="btn btn-primary">Create Account</button>
    
    <div id="status-message"></div>
    
    <p style="margin-top:20px; font-size: 0.9rem;">Already have an account? <a href="signin.html" class="link-text">Sign In</a></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app-check.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        updateProfile, 
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyApyOAfcEB8nGc-B3IO4X8wIl-nVi3nKeo",
        authDomain: "maylearninghub.firebaseapp.com",
        projectId: "maylearninghub",
        storageBucket: "maylearninghub.firebasestorage.app",
        messagingSenderId: "237875455146",
        appId: "1:237875455146:web:21310d33b56664d669dcd3"
    };

    const app = initializeApp(firebaseConfig);

    if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }

    const appCheck = initializeAppCheck(app, {
        provider: new ReCaptchaV3Provider("6LfPNb0sAAAAAKWmsT-rqt2jQTfOuJWTN9Wlv4Vj"),
        isTokenAutoRefreshEnabled: true
    });

    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- SMART CASCADING SCHOOL DATABASE ---
    const schoolDatabase = {
        "KwaZulu-Natal": {
            "iLembe": [
                "Nonhlevu Secondary School",
                "Stanger High School",
                "Gledhow Primary School",
                "Groutville",
                "Ricardo"
            ],
            "King Cetshwayo": [
                "Richards Bay High School",
                "Empangeni High School",
                "Birdswood Secondary School",
                "Gwejobomvu Secondary School",
                "Tholokuhle High School"
            ],
            "uMgungundlovu": [
                "Edendale Technical High School",
                "Mehlokazulu Technical High School",
                "Nsikayethu",
                "Smero Secondary School",
                "Sukuma Comprehensive School",
                "Zibukezulu Technical School"
            ],
            "Umlazi": [
                "Umlazi Comtech",
                "Menzi High School",
                "Grosvenor Boys High School"
            ]
        },
        "Gauteng": {
            "Johannesburg East": [
                "Parktown Boys High",
                "Jeppe High School for Boys"
            ]
        }
    };

    // UI elements for Cascading logic
    const provinceSelect = document.getElementById('province');
    const districtSelect = document.getElementById('district');
    const schoolInput = document.getElementById('school');
    const schoolList = document.getElementById('school-list');

    // 1. When Province Changes -> Load Districts
    provinceSelect.addEventListener('change', () => {
        const selectedProvince = provinceSelect.value;
        districtSelect.innerHTML = '<option value="" disabled selected>Select Your District</option>';
        schoolInput.value = '';
        schoolInput.disabled = true;

        if (schoolDatabase[selectedProvince]) {
            districtSelect.disabled = false;
            // Get districts alphabetically
            const districts = Object.keys(schoolDatabase[selectedProvince]).sort();
            
            districts.forEach(district => {
                const option = document.createElement('option');
                option.value = district;
                option.textContent = district;
                districtSelect.appendChild(option);
            });
        } else {
            // If we don't have data for this province yet, we can let them type manually as a fallback
            districtSelect.disabled = true;
            districtSelect.innerHTML = '<option value="" disabled selected>Data pending...</option>';
            schoolInput.disabled = false;
            schoolList.innerHTML = '';
            schoolInput.placeholder = "Type your school name manually...";
        }
    });

    // 2. When District Changes -> Load Schools into Datalist
    districtSelect.addEventListener('change', () => {
        const selectedProvince = provinceSelect.value;
        const selectedDistrict = districtSelect.value;
        
        schoolInput.value = '';
        schoolList.innerHTML = '';

        if (schoolDatabase[selectedProvince] && schoolDatabase[selectedProvince][selectedDistrict]) {
            schoolInput.disabled = false;
            schoolInput.placeholder = "Start typing your school name...";
            
            const schools = schoolDatabase[selectedProvince][selectedDistrict].sort();
            schools.forEach(schoolName => {
                const option = document.createElement('option');
                option.value = schoolName;
                schoolList.appendChild(option);
            });
        }
    });

    // --- EXISTING AUTH UI ELEMENTS ---
    const roleSelect = document.getElementById('role');
    const gradeSelect = document.getElementById('grade');
    const learnerSection = document.getElementById('learnerSection');
    const teacherSection = document.getElementById('teacherSection');
    const learnerSubjects = document.getElementById('learnerSubjects');
    const emailSignupBtn = document.getElementById('emailSignup');
    const statusMessage = document.getElementById('status-message');
    
    let isSigningUp = false; 

    function setLoading(isLoading) {
        emailSignupBtn.disabled = isLoading;
        emailSignupBtn.textContent = isLoading ? "Creating Account..." : "Create Account";
    }

    function showStatus(message, color = "#cc0000") {
        statusMessage.textContent = message;
        statusMessage.style.color = color;
    }

    const handleRedirect = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlRedirect = urlParams.get('redirect');
        const savedRedirect = sessionStorage.getItem('redirectURL');

        let nextURL = urlRedirect || savedRedirect || 'index.html';

        try {
            const destination = new URL(nextURL, window.location.origin);
            if (destination.origin !== window.location.origin) {
                nextURL = 'index.html';
            } else {
                nextURL = destination.href;
            }
        } catch (error) {
            nextURL = 'index.html';
        }

        sessionStorage.removeItem('redirectURL');
        window.location.href = nextURL;
    };

    onAuthStateChanged(auth, (user) => {
        if (user && !isSigningUp) {
            handleRedirect();
        }
    });

    roleSelect.onchange = () => {
        if (roleSelect.value === 'learner') {
            learnerSection.classList.remove('hidden');
            teacherSection.classList.add('hidden');
        } else if (roleSelect.value === 'teacher') {
            teacherSection.classList.remove('hidden');
            learnerSection.classList.add('hidden');
        }
    };

    gradeSelect.onchange = () => {
        const gradeVal = parseInt(gradeSelect.value);
        if (gradeVal >= 10) {
            learnerSubjects.classList.remove('hidden');
        } else {
            learnerSubjects.classList.add('hidden');
        }
    };

    function validateAndGetUserData(firstName, lastName, email, phone, province, district, role, school) {
        if (!firstName || !lastName || !email || !province || !role || !school) {
            showStatus("Please fill in all required fields.");
            return null;
        }

        let selectedSubjects = [];

        if (role === 'teacher') {
            selectedSubjects = Array.from(document.querySelectorAll('.t-sub:checked')).map(cb => cb.value);
            if (selectedSubjects.length === 0) {
                showStatus("Please select at least one subject.");
                return null;
            }
        } else if (role === 'learner') {
            if (!gradeSelect.value) {
                showStatus("Please select your grade.");
                return null;
            }

            if (parseInt(gradeSelect.value) >= 10) {
                selectedSubjects = Array.from(document.querySelectorAll('.l-sub:checked')).map(cb => cb.value);
                if (selectedSubjects.length === 0) {
                    showStatus("Please select your subjects.");
                    return null;
                }
            }
        }

        const userData = {
            fullName: `${firstName} ${lastName}`,
            email: email,
            province: province,
            district: district || "Unknown",
            role: role,
            school: school,
            createdAt: new Date()
        };

        if (phone) userData.phone = phone;

        if (role === 'learner') {
            userData.grade = gradeSelect.value;
            if (parseInt(gradeSelect.value) >= 10) {
                userData.subjects = selectedSubjects;
            }
        } else {
            userData.subjects = selectedSubjects;
        }

        return userData;
    }

    emailSignupBtn.onclick = async () => {
        statusMessage.textContent = '';
        
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const province = document.getElementById('province').value;
        const district = document.getElementById('district').value;
        const pass = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        const role = roleSelect.value;
        const school = document.getElementById('school').value.trim();

        if (!pass || pass.length < 6) {
            showStatus("Password must be at least 6 characters long.");
            return;
        }

        if (pass !== confirmPass) {
            showStatus("Passwords do not match. Please try again.");
            return;
        }

        const userData = validateAndGetUserData(firstName, lastName, email, phone, province, district, role, school);
        if (!userData) return; 

        try {
            setLoading(true);
            isSigningUp = true; 
            
            showStatus("Creating secure profile...", "#0056ff");
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            
            const fullDisplayName = `${firstName} ${lastName}`;
            await updateProfile(userCredential.user, { displayName: fullDisplayName });

            userData.uid = userCredential.user.uid;
            
            showStatus("Saving data to database...", "#0056ff");
            await setDoc(doc(db, "users", userCredential.user.uid), userData);
            
            showStatus("Success! Redirecting...", "#00c853");
            
            setTimeout(() => {
                handleRedirect();
            }, 800);

        } catch (err) {
            console.error("Signup Failed: ", err);
            showStatus("Error: " + err.message);
            setLoading(false);
            isSigningUp = false;
        }
    };
</script>
</body>
</html>
