<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Reset Password | May Learning Hub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        
        .auth-card h2 { color: #0056ff; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; transition: all 0.3s ease; }
        .btn-primary { background: linear-gradient(135deg, #0056ff, #00d4ff); color: white; }
        .btn-primary:disabled { background: #a1c4f4; cursor: not-allowed; }
        
        #message-box { margin: 15px 0; font-size: 0.9rem; font-weight: 600; padding: 10px; border-radius: 8px; }
        .error { color: #cc0000; background: #ffe6e6; }
        .success { color: #00c853; background: #e6fdf0; }
        .info { color: #555; }
        .link-text { color: #0072ff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Set New Password</h2>
        <div id="message-box" class="info">Verifying your link...</div>

        <form id="reset-form" style="display: none;">
            <input type="password" id="new-password" placeholder="New Password" required minlength="6">
            <input type="password" id="confirm-password" placeholder="Confirm New Password" required minlength="6">
            <button type="submit" id="submit-btn" class="btn btn-primary">Update Password</button>
        </form>

        <div id="login-link" style="margin-top: 20px; display: none;">
            <a href="signin.html" class="link-text">Return to Sign In</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApyOAfcEB8nGc-B3IO4X8wIl-nVi3nKeo",
            authDomain: "maylearninghub.firebaseapp.com",
            projectId: "maylearninghub",
            storageBucket: "maylearninghub.firebasestorage.app",
            messagingSenderId: "237875455146",
            appId: "1:237875455146:web:21310d33b56664d669dcd3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('reset-form');
        const messageBox = document.getElementById('message-box');
        const loginLink = document.getElementById('login-link');
        const submitBtn = document.getElementById('submit-btn');

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = type;
        }

        const actionCode = new URLSearchParams(window.location.search).get('oobCode');

        if (!actionCode) {
            showMessage("Invalid link. Please request a new password reset from the sign-in page.", "error");
        } else {
            verifyPasswordResetCode(auth, actionCode)
                .then((email) => {
                    showMessage(`Resetting password for: ${email}`, "info");
                    form.style.display = 'block';
                })
                .catch(() => showMessage("This link has expired or is invalid.", "error"));
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) return showMessage("Passwords do not match!", "error");

            submitBtn.disabled = true;
            submitBtn.textContent = "Updating...";

            try {
                await confirmPasswordReset(auth, actionCode, newPassword);
                form.style.display = 'none';
                showMessage("Success! Your password has been updated.", "success");
                loginLink.style.display = 'block';
            } catch (err) {
                showMessage("Error: " + err.message, "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Update Password";
            }
        });
    </script>
</body>
</html>
