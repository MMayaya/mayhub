<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 12 Life Sciences: Evolution Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }

        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }

        .game-header { text-align: center; padding: 2rem 1rem 1rem; }
        .game-title { color: #004080; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 1.5rem; font-size: 1.1rem; }

        .game-wrapper { display: flex; max-width: 1100px; margin: 0 auto 3rem; gap: 2rem; padding: 0 20px; width: 100%; align-items: flex-start; }

        .game-board { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 6px solid #3385ff; padding: 2rem; display: flex; flex-direction: column; }

        .lifelines { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .lifeline-btn { background: #002b5e; color: #fff; border: 2px solid #b3d4ff; padding: 0.8rem 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .lifeline-btn:hover:not(:disabled) { background: #3385ff; transform: translateY(-2px); }
        .lifeline-btn:disabled { background: #ccc; border-color: #aaa; color: #666; cursor: not-allowed; transform: none; box-shadow: none; text-decoration: line-through; }

        .question-box { background: #004080; color: #fff; padding: 2rem; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 2rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .answer-btn { background: #f0f7ff; border: 2px solid #3385ff; color: #002b5e; padding: 1.2rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; position: relative; overflow: hidden; }
        .answer-btn::before { content: attr(data-letter) ": "; color: #3385ff; margin-right: 0.5rem; }
        .answer-btn:hover:not(:disabled) { background: #e6f0fa; border-color: #004080; transform: scale(1.02); }

        .answer-btn.selected { background: #ffc107; border-color: #d39e00; color: #000; }
        .answer-btn.correct { background: #28a745 !important; border-color: #1e7e34 !important; color: #fff !important; }
        .answer-btn.incorrect { background: #dc3545 !important; border-color: #bd2130 !important; color: #fff !important; }
        .answer-btn.hidden { visibility: hidden; }

        .prize-ladder { width: 280px; background: #001a33; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column-reverse; gap: 0.1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.2); max-height: 600px; overflow-y: auto; }
        .ladder-step { display: flex; justify-content: space-between; padding: 0.2rem 0.6rem; color: #66a3ff; font-weight: bold; border-radius: 4px; transition: all 0.3s; font-size: 0.85rem; }
        .ladder-step.active { background: #ffc107; color: #000; transform: scale(1.05); }
        .ladder-step.passed { color: #28a745; }
        .ladder-step.milestone { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.2); }

        #endScreen { display: none; text-align: center; padding: 3rem 1rem; }
        #endMessage { font-size: 1.8rem; color: #004080; margin-bottom: 1rem; }
        #endPrize { font-size: 2.5rem; color: #28a745; font-weight: bold; margin-bottom: 2rem; }

        @media (max-width: 850px) {
            .game-wrapper { flex-direction: column; }
            .prize-ladder { width: 100%; flex-direction: row; flex-wrap: wrap; height: auto; }
            .answers-grid { grid-template-columns: 1fr; }
        }

        footer { text-align: center; padding: 1rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">R1,000,000 Life Sciences Challenge</h1>
        <p class="game-subtitle">Evolution (Grade 12 Term 3)</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Evolution - Grade 12 Life Sciences Term 3 presentation.</p>
    </header>

    <main class="game-wrapper">
        <div class="game-board" id="gameBoard">
            <div class="lifelines">
                <button class="lifeline-btn" id="btn5050" onclick="use5050()">50 / 50</button>
                <button class="lifeline-btn" id="btnHint" onclick="useHint()">Get a Hint</button>
            </div>

            <div class="question-box">
                <span id="questionText">Loading question...</span>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-letter="A" id="btn0" onclick="selectAnswer(0)"></button>
                <button class="answer-btn" data-letter="B" id="btn1" onclick="selectAnswer(1)"></button>
                <button class="answer-btn" data-letter="C" id="btn2" onclick="selectAnswer(2)"></button>
                <button class="answer-btn" data-letter="D" id="btn3" onclick="selectAnswer(3)"></button>
            </div>
        </div>

        <div class="game-board" id="endScreen">
            <h2 id="endMessage">Game Over!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Your final winnings:</p>
            <div id="endPrize">R0</div>
            <button class="lifeline-btn" onclick="location.reload()">New Game</button>
        </div>

        <div class="prize-ladder" id="prizeLadder"></div>
    </main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const questions = [
            { q: "What is evolution?", options: ["Change in population characteristics over generations", "Change in one individual during life", "Only the formation of fossils", "Only continental movement"], a: 0, hint: "Evolution happens to populations over time." },
            { q: "Which description defines a population?", options: ["A same-species breeding unit in one habitat at the same time", "All organisms on Earth", "One organism and its organs", "Different species that cannot breed"], a: 0, hint: "It must be the same species, place, and time." },
            { q: "Why is evolution called a scientific theory?", options: ["It is supported by evidence and repeated testing", "It is an unsupported guess", "It cannot be tested", "It is based only on belief"], a: 0, hint: "Scientific theory has a stronger meaning than everyday theory." },
            { q: "What is a hypothesis?", options: ["A testable possible explanation", "An unchangeable fact", "A cultural value", "A fossil layer"], a: 0, hint: "Scientists test it with observations or experiments." },
            { q: "Which list contains the main evidence sources in the presentation?", options: ["Fossils, anatomy, biogeography, genetics, variation", "Weather, soil, clouds, rivers, rocks", "Beliefs, guesses, names, dates, places", "Only fossils"], a: 0, hint: "Five sections support evolution." },
            { q: "What is paleontology?", options: ["The study of fossils", "The study of weather", "The study of living cells only", "The study of continents only"], a: 0, hint: "Paleo relates to past life." },
            { q: "Where are older fossils usually found?", options: ["In deeper geological strata", "Above all younger fossils", "Only at the surface", "Only in oceans"], a: 0, hint: "Older rock layers are generally deeper." },
            { q: "What can the fossil record reveal?", options: ["Change, extinction, and the order groups appeared", "Only current species", "Exact DNA sequences only", "Only individual growth"], a: 0, hint: "Fossils document past life." },
            { q: "What do dinosaur and mammal strata indicate?", options: ["Dinosaurs evolved before mammals", "Mammals evolved before dinosaurs", "Both groups appeared together", "Dinosaurs still exist unchanged"], a: 0, hint: "The earliest mammal fossils occur in younger strata." },
            { q: "Why is Archaeopteryx useful evidence?", options: ["It has features linking different groups", "It is a modern reptile", "It shows continental drift only", "It is a gene sequence"], a: 0, hint: "Its mixed features help trace relationships." },
            { q: "What is modification by descent?", options: ["Common ancestry followed by modification over time", "One organism changing during life", "Artificial selection only", "The movement of chromosomes"], a: 0, hint: "Related species can become differently adapted." },
            { q: "Why does the pentadactyl limb support common ancestry?", options: ["Mammals share one basic bone plan", "All mammal limbs have the same function", "It occurs only in bats", "It has no digits"], a: 0, hint: "The bones are modified but recognisably similar." },
            { q: "What defines homologous structures?", options: ["Similar structure, different functions", "Different structure, same function", "Identical genes only", "No shared ancestry"], a: 0, hint: "Mammal forelimbs are the example." },
            { q: "Which pair is analogous?", options: ["Bird wing and insect wing", "Mole and bat forelimbs", "Horse and seal forelimbs", "Monkey and bat forelimbs"], a: 0, hint: "Same function, different basic structure." },
            { q: "Which feature adapts a mole forelimb for digging?", options: ["Broad shovel-shaped phalanges", "A skin wing membrane", "One phalanx forming a hoof", "A broad flipper"], a: 0, hint: "The paw pushes soil backwards." },
            { q: "Which feature adapts a bat forelimb for flight?", options: ["Elongated digits with skin membranes", "Short thick carpals for digging", "A hoof", "A pincer grip"], a: 0, hint: "The limb forms a wing." },
            { q: "Which feature helps a horse run on hard ground?", options: ["One phalanx forms a hoof", "Skin between elongated fingers", "Backwards-facing paws", "A broad paddle"], a: 0, hint: "The leg is long and aligned for fast movement." },
            { q: "How is a seal forelimb adapted?", options: ["It forms a broad flipper for swimming", "It forms a shovel for digging", "It has a hoof", "It has a pincer grip"], a: 0, hint: "The metacarpals and phalanges spread into a paddle." },
            { q: "What does biogeography study?", options: ["The geographical distribution of organisms", "The chemistry of genes", "Only fossil age", "Only body structure"], a: 0, hint: "It connects where organisms live with Earth's history." },
            { q: "What were the two supercontinents formed when Pangaea split?", options: ["Laurasia and Gondwana", "Africa and Asia", "Permian and Cretaceous", "East and West Pangaea"], a: 0, hint: "One was northern and one southern." },
            { q: "Why do Mesosaurus fossils support continental drift?", options: ["They occur in eastern South America and western Africa", "They occur only in Europe", "They are modern reptiles", "They are found in the atmosphere"], a: 0, hint: "The two continents were once joined." },
            { q: "What does the distribution of southern flightless birds suggest?", options: ["Common ancestry before Gondwana split", "Independent creation on one island", "No evolutionary relationship", "Only analogous wings"], a: 0, hint: "Ostrich, rhea, emu, kiwi, moa, and tinamou are the examples." },
            { q: "What genetic evidence indicates close relationship?", options: ["Very similar DNA or RNA sequences", "Very different gene sequences", "Identical habitats only", "The same common name"], a: 0, hint: "Sequence similarity is key." },
            { q: "What does a branch split on a phylogenetic tree represent?", options: ["A common ancestor", "A geological layer", "A belief", "An individual mutation only"], a: 0, hint: "Two evolutionary lines diverge there." },
            { q: "What does each split on a cladogram represent?", options: ["Evolution of a new characteristic", "Extinction of every species", "Movement of a continent", "A fossil being buried"], a: 0, hint: "The new feature is absent from earlier species." },
            { q: "Why is variation important for evolution?", options: ["It supplies raw material for natural selection", "It makes every individual identical", "It prevents selection", "It removes all mutations"], a: 0, hint: "Selection needs differences to act on." },
            { q: "How does crossing over create variation?", options: ["It exchanges maternal and paternal chromosome material", "It removes chromosomes", "It copies one parent exactly", "It prevents meiosis"], a: 0, hint: "It occurs in prophase I." },
            { q: "What can a mutation do?", options: ["Change a gene or chromosome and alter genotype", "Always improve an organism", "Never affect phenotype", "Only change habitat"], a: 0, hint: "Its effect may be harmful, neutral, or useful." },
            { q: "Which comparison is correct?", options: ["Blood group is discontinuous; height is continuous", "Height is discontinuous; blood group is continuous", "Both always form discrete classes", "Both are controlled by one gene"], a: 0, hint: "One has categories and one has a range." },
            { q: "Why may continuous traits evolve more slowly under selection?", options: ["They are controlled by many genes and show a range", "They are controlled by one gene", "They have no phenotypes", "They cannot vary"], a: 0, hint: "Many genes contribute to each phenotype." }
        ];
        const prizes = [
            "R100", "R200", "R300", "R500", "R1,000",
            "R2,000", "R3,000", "R4,000", "R5,000", "R10,000",
            "R15,000", "R20,000", "R25,000", "R30,000", "R40,000",
            "R50,000", "R60,000", "R70,000", "R80,000", "R100,000",
            "R150,000", "R200,000", "R250,000", "R300,000", "R400,000",
            "R500,000", "R600,000", "R750,000", "R850,000", "R1,000,000"
        ];

        let currentLevel = 0;
        let isWaiting = false;

        const ladderContainer = document.getElementById('prizeLadder');
        for (let i = 0; i < 30; i++) {
            let step = document.createElement('div');
            step.className = 'ladder-step';
            step.id = `ladder-${i}`;
            if ((i + 1) % 5 === 0) step.classList.add('milestone');
            step.innerHTML = `<span>${i + 1}</span> <span>${prizes[i]}</span>`;
            ladderContainer.appendChild(step);
        }

        function loadQuestion() {
            isWaiting = false;
            document.querySelectorAll('.ladder-step').forEach((el, index) => {
                el.classList.remove('active');
                if (index < currentLevel) el.classList.add('passed');
            });
            document.getElementById(`ladder-${currentLevel}`).classList.add('active');

            const qData = questions[currentLevel];
            document.getElementById('questionText').innerText = `Q${currentLevel + 1}: ${qData.q}`;

            let options = [...qData.options];
            let correctText = options[qData.a];
            options.sort(() => Math.random() - 0.5);
            let correctIdx = options.indexOf(correctText);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn${i}`);
                btn.innerText = options[i];
                btn.className = 'answer-btn';
                btn.disabled = false;
                btn.classList.remove('hidden', 'selected', 'correct', 'incorrect');
                btn.setAttribute('data-correct', i === correctIdx);
            }
        }

        function selectAnswer(selectedIndex) {
            if (isWaiting) return;
            isWaiting = true;

            const selectedBtn = document.getElementById(`btn${selectedIndex}`);
            const isCorrect = selectedBtn.getAttribute('data-correct') === 'true';
            if (isCorrect) MayHubSounds.playCorrect();
            else MayHubSounds.playWrong();

            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).disabled = true;
            }

            selectedBtn.classList.add('selected');

            setTimeout(() => {
                selectedBtn.classList.remove('selected');

                if (isCorrect) {
                    selectedBtn.classList.add('correct');
                    setTimeout(() => {
                        currentLevel++;
                        if (currentLevel >= 30) endGame(true);
                        else loadQuestion();
                    }, 1000);
                } else {
                    selectedBtn.classList.add('incorrect');
                    for (let i = 0; i < 4; i++) {
                        if (document.getElementById(`btn${i}`).getAttribute('data-correct') === 'true') {
                            document.getElementById(`btn${i}`).classList.add('correct');
                        }
                    }
                    setTimeout(() => endGame(false), 2000);
                }
            }, 1000);
        }

        function use5050() {
            if (isWaiting) return;
            document.getElementById('btn5050').disabled = true;
            let hiddenCount = 0;
            for(let i=0; i<4; i++){
                let btn = document.getElementById(`btn${i}`);
                if(btn.getAttribute('data-correct') === 'false' && hiddenCount < 2) {
                    btn.classList.add('hidden');
                    hiddenCount++;
                }
            }
        }

        function useHint() {
            if (isWaiting) return;
            document.getElementById('btnHint').disabled = true;
            alert("Life Sciences Teacher Hint: " + questions[currentLevel].hint);
        }

        function endGame(won) {
            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            if (won) {
                document.getElementById('endMessage').innerText = "Life Sciences Legend!";
                document.getElementById('endPrize').innerText = "R1,000,000";
            } else {
                document.getElementById('endMessage').innerText = "Final Winnings:";
                document.getElementById('endPrize').innerText = currentLevel > 0 ? prizes[currentLevel - 1] : "R0";
            }
        }
        loadQuestion();
    </script>
</body>
</html>
