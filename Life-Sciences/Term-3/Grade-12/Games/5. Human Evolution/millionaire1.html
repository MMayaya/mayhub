<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 12 Life Sciences: Human Evolution Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }

        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }

        .game-header { text-align: center; padding: 2rem 1rem 1rem; }
        .game-title { color: #004080; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 1.5rem; font-size: 1.1rem; }

        .game-wrapper { display: flex; max-width: 1100px; margin: 0 auto 3rem; gap: 2rem; padding: 0 20px; width: 100%; align-items: flex-start; }

        .game-board { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 6px solid #3385ff; padding: 2rem; display: flex; flex-direction: column; }

        .lifelines { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .lifeline-btn { background: #002b5e; color: #fff; border: 2px solid #b3d4ff; padding: 0.8rem 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .lifeline-btn:hover:not(:disabled) { background: #3385ff; transform: translateY(-2px); }
        .lifeline-btn:disabled { background: #ccc; border-color: #aaa; color: #666; cursor: not-allowed; transform: none; box-shadow: none; text-decoration: line-through; }

        .question-box { background: #004080; color: #fff; padding: 2rem; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 2rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .answer-btn { background: #f0f7ff; border: 2px solid #3385ff; color: #002b5e; padding: 1.2rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; position: relative; overflow: hidden; }
        .answer-btn::before { content: attr(data-letter) ": "; color: #3385ff; margin-right: 0.5rem; }
        .answer-btn:hover:not(:disabled) { background: #e6f0fa; border-color: #004080; transform: scale(1.02); }

        .answer-btn.selected { background: #ffc107; border-color: #d39e00; color: #000; }
        .answer-btn.correct { background: #28a745 !important; border-color: #1e7e34 !important; color: #fff !important; }
        .answer-btn.incorrect { background: #dc3545 !important; border-color: #bd2130 !important; color: #fff !important; }
        .answer-btn.hidden { visibility: hidden; }

        .prize-ladder { width: 280px; background: #001a33; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column-reverse; gap: 0.1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.2); max-height: 600px; overflow-y: auto; }
        .ladder-step { display: flex; justify-content: space-between; padding: 0.2rem 0.6rem; color: #66a3ff; font-weight: bold; border-radius: 4px; transition: all 0.3s; font-size: 0.85rem; }
        .ladder-step.active { background: #ffc107; color: #000; transform: scale(1.05); }
        .ladder-step.passed { color: #28a745; }
        .ladder-step.milestone { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.2); }

        #endScreen { display: none; text-align: center; padding: 3rem 1rem; }
        #endMessage { font-size: 1.8rem; color: #004080; margin-bottom: 1rem; }
        #endPrize { font-size: 2.5rem; color: #28a745; font-weight: bold; margin-bottom: 2rem; }

        @media (max-width: 850px) {
            .game-wrapper { flex-direction: column; }
            .prize-ladder { width: 100%; flex-direction: row; flex-wrap: wrap; height: auto; }
            .answers-grid { grid-template-columns: 1fr; }
        }

        footer { text-align: center; padding: 1rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../index.html">Home</a>
            <a href="../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">R1,000,000 Life Sciences Challenge</h1>
        <p class="game-subtitle">Human Evolution (Grade 12 Term 3)</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: Human Evolution - Grade 12 Life Sciences Term 3 presentation.</p>
    </header>

    <main class="game-wrapper">
        <div class="game-board" id="gameBoard">
            <div class="lifelines">
                <button class="lifeline-btn" id="btn5050" onclick="use5050()">50 / 50</button>
                <button class="lifeline-btn" id="btnHint" onclick="useHint()">Get a Hint</button>
            </div>

            <div class="question-box">
                <span id="questionText">Loading question...</span>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-letter="A" id="btn0" onclick="selectAnswer(0)"></button>
                <button class="answer-btn" data-letter="B" id="btn1" onclick="selectAnswer(1)"></button>
                <button class="answer-btn" data-letter="C" id="btn2" onclick="selectAnswer(2)"></button>
                <button class="answer-btn" data-letter="D" id="btn3" onclick="selectAnswer(3)"></button>
            </div>
        </div>

        <div class="game-board" id="endScreen">
            <h2 id="endMessage">Game Over!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Your final winnings:</p>
            <div id="endPrize">R0</div>
            <button class="lifeline-btn" onclick="location.reload()">New Game</button>
        </div>

        <div class="prize-ladder" id="prizeLadder"></div>
    </main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

        <script src="../../../../../game-audio.js"></script>
<script>
        const questions = [
            { q: "To which family do humans belong?", options: ["Hominidae", "Felidae", "Canidae", "Bovidae"], a: 0, hint: "This family includes great apes and human ancestors." },
            { q: "What is the human scientific name?", options: ["Homo sapiens", "Homo habilis", "Australopithecus africanus", "Ardipithecus ramidus"], a: 0, hint: "Genus and species are required." },
            { q: "Which are the three major hominid genera?", options: ["Ardipithecus, Australopithecus, Homo", "Primate, Anthropoid, Mammal", "Gorilla, Pan, Pongo", "Habilis, Erectus, Sapiens"], a: 0, hint: "The sequence begins with Ardipithecus." },
            { q: "Who are humans' closest living relatives?", options: ["Chimpanzees", "Gorillas", "Orangutans", "Baboons"], a: 0, hint: "The shared ancestor lived about six million years ago." },
            { q: "Which evidence is strongest today for relatedness?", options: ["Gene sequencing", "Only body height", "Only creation accounts", "Only habitat"], a: 0, hint: "DNA comparisons supplement fossils." },
            { q: "What does stereoscopic vision provide?", options: ["Depth perception and distance judgement", "Improved smell", "A larger jaw", "Quadrupedal movement"], a: 0, hint: "The visual fields overlap." },
            { q: "Which human spine shape supports upright posture?", options: ["S-shaped", "C-shaped", "Straight only", "Circular"], a: 0, hint: "It balances the trunk above the legs." },
            { q: "What is the human pelvis shape?", options: ["Short, broad, and cup-shaped", "Long and narrow", "Flat and open", "Long and rectangular"], a: 0, hint: "It supports abdominal organs during bipedalism." },
            { q: "Where is the human foramen magnum?", options: ["Under or toward the front of the skull", "At the far back", "In the jaw", "In the pelvis"], a: 0, hint: "This helps the skull balance on the vertebral column." },
            { q: "What is bipedalism?", options: ["Habitual upright walking on two limbs", "Knuckle-walking", "Climbing with four limbs", "A type of vision"], a: 0, hint: "Humans are fully adapted to it." },
            { q: "Which came first in human evolution?", options: ["Bipedalism", "Very large cranial capacity", "Pottery", "Complex language"], a: 0, hint: "Early bipeds still had small brains." },
            { q: "How is mitochondrial DNA inherited?", options: ["From the mother", "From the father", "Only from grandparents", "From both parents equally"], a: 0, hint: "The ovum supplies mitochondria to the zygote." },
            { q: "Where did Mitochondrial Eve live?", options: ["Africa", "Java", "Europe", "Australia"], a: 0, hint: "Her maternal line dates to about 150 000 years ago." },
            { q: "What does Y-chromosome DNA trace?", options: ["Paternal ancestry", "Maternal ancestry", "Only cultural evidence", "Tool development"], a: 0, hint: "It passes from father to son." },
            { q: "Which hominid means 'handy man'?", options: ["Homo habilis", "Homo erectus", "Homo sapiens", "Ardipithecus"], a: 0, hint: "It is associated with recognisable primitive stone tools." },
            { q: "Which hominid first controlled fire?", options: ["Homo erectus", "Australopithecus afarensis", "Ardipithecus", "Homo habilis"], a: 0, hint: "It also made more complex tools." },
            { q: "Which footprint site proves early bipedalism?", options: ["Laetoli", "Blombos", "Border Cave", "Florisbad"], a: 0, hint: "Mary Leakey discovered the footprints in Tanzania." },
            { q: "Who is Lucy?", options: ["Australopithecus afarensis", "Ardipithecus ramidus", "Homo erectus", "Australopithecus boisei"], a: 0, hint: "Don Johanson discovered this fossil." },
            { q: "Which fossil is Nutcracker Man?", options: ["Australopithecus boisei", "Homo habilis", "Turkana Boy", "Omo"], a: 0, hint: "It had a robust skull, sagittal crest, and large molars." },
            { q: "Which fossil is Turkana Boy?", options: ["Homo erectus", "Australopithecus africanus", "Homo habilis", "Ardipithecus"], a: 0, hint: "Its body proportions resembled modern humans." },
            { q: "Who discovered Taung Child?", options: ["Raymond Dart", "Robert Broom", "Tim White", "Richard Leakey"], a: 0, hint: "It was described in 1924." },
            { q: "Which South African fossil is called Mrs Ples?", options: ["Australopithecus africanus", "Australopithecus sediba", "Homo sapiens", "Homo erectus"], a: 0, hint: "Robert Broom found the nearly complete skull." },
            { q: "Which fossil is called Karabo?", options: ["Australopithecus sediba", "Australopithecus boisei", "Ardipithecus ramidus", "Homo heidelbergensis"], a: 0, hint: "It combines ape-like and human-like features." },
            { q: "What does Border Cave burial evidence suggest?", options: ["Abstract thought and emotional attachment", "No cultural behaviour", "Only quadrupedalism", "An Asian origin"], a: 0, hint: "An infant burial was found with tools and beads." },
            { q: "What general cranial-capacity trend occurred?", options: ["About 300-350 cubic centimetres to about 1 300 cubic centimetres", "About 1 300 cubic centimetres to 300 cubic centimetres", "No change", "An immediate jump in one generation"], a: 0, hint: "Ardipithecus begins the listed trend; Homo sapiens ends it." },
            { q: "Who first migrated out of Africa about two million years ago?", options: ["Homo erectus", "Homo sapiens", "Ardipithecus", "Australopithecus africanus"], a: 0, hint: "Climate and food movement may have contributed." },
            { q: "When did Homo sapiens migrate out of Africa?", options: ["Around 90 000 years ago", "Around 4.5 million years ago", "Around 2 million years ago", "Around 10 million years ago"], a: 0, hint: "This was the second migration described." },
            { q: "What was proclaimed at Maropeng in 1999?", options: ["The Cradle of Humankind World Heritage Site", "The Laetoli footprint reserve", "The Middle Awash Valley", "Olduvai Gorge"], a: 0, hint: "It includes sites around Sterkfontein." },
            { q: "Which evidence strongly supports an African origin?", options: ["Early African fossils plus genetic evidence", "Only a Java fossil", "Only literal religious texts", "Absence of African fossils"], a: 0, hint: "Australopithecines and Homo habilis are found only in Africa." },
            { q: "Which comparison between science and belief is correct?", options: ["Science tests evidence and can change; beliefs may rest on faith or culture", "Both require identical experiments", "Beliefs always use radiometric dating", "Scientific theories cannot be revised"], a: 0, hint: "The presentation treats these as different kinds of explanation." }
        ];
                const prizes = [
            "R100", "R200", "R300", "R500", "R1,000",
            "R2,000", "R3,000", "R4,000", "R5,000", "R10,000",
            "R15,000", "R20,000", "R25,000", "R30,000", "R40,000",
            "R50,000", "R60,000", "R70,000", "R80,000", "R100,000",
            "R150,000", "R200,000", "R250,000", "R300,000", "R400,000",
            "R500,000", "R600,000", "R750,000", "R850,000", "R1,000,000"
        ];

        let currentLevel = 0;
        let isWaiting = false;

        const ladderContainer = document.getElementById('prizeLadder');
        for (let i = 0; i < 30; i++) {
            let step = document.createElement('div');
            step.className = 'ladder-step';
            step.id = `ladder-${i}`;
            if ((i + 1) % 5 === 0) step.classList.add('milestone');
            step.innerHTML = `<span>${i + 1}</span> <span>${prizes[i]}</span>`;
            ladderContainer.appendChild(step);
        }

        function loadQuestion() {
            isWaiting = false;
            document.querySelectorAll('.ladder-step').forEach((el, index) => {
                el.classList.remove('active');
                if (index < currentLevel) el.classList.add('passed');
            });
            document.getElementById(`ladder-${currentLevel}`).classList.add('active');

            const qData = questions[currentLevel];
            document.getElementById('questionText').innerText = `Q${currentLevel + 1}: ${qData.q}`;

            let options = [...qData.options];
            let correctText = options[qData.a];
            options.sort(() => Math.random() - 0.5);
            let correctIdx = options.indexOf(correctText);

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn${i}`);
                btn.innerText = options[i];
                btn.className = 'answer-btn';
                btn.disabled = false;
                btn.classList.remove('hidden', 'selected', 'correct', 'incorrect');
                btn.setAttribute('data-correct', i === correctIdx);
            }
        }

        function selectAnswer(selectedIndex) {
            if (isWaiting) return;
            isWaiting = true;

            const selectedBtn = document.getElementById(`btn${selectedIndex}`);
            const isCorrect = selectedBtn.getAttribute('data-correct') === 'true';
            if (isCorrect) MayHubSounds.playCorrect();
            else MayHubSounds.playWrong();

            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).disabled = true;
            }

            selectedBtn.classList.add('selected');

            setTimeout(() => {
                selectedBtn.classList.remove('selected');

                if (isCorrect) {
                    selectedBtn.classList.add('correct');
                    setTimeout(() => {
                        currentLevel++;
                        if (currentLevel >= 30) endGame(true);
                        else loadQuestion();
                    }, 1000);
                } else {
                    selectedBtn.classList.add('incorrect');
                    for (let i = 0; i < 4; i++) {
                        if (document.getElementById(`btn${i}`).getAttribute('data-correct') === 'true') {
                            document.getElementById(`btn${i}`).classList.add('correct');
                        }
                    }
                    setTimeout(() => endGame(false), 2000);
                }
            }, 1000);
        }

        function use5050() {
            if (isWaiting) return;
            document.getElementById('btn5050').disabled = true;
            let hiddenCount = 0;
            for(let i=0; i<4; i++){
                let btn = document.getElementById(`btn${i}`);
                if(btn.getAttribute('data-correct') === 'false' && hiddenCount < 2) {
                    btn.classList.add('hidden');
                    hiddenCount++;
                }
            }
        }

        function useHint() {
            if (isWaiting) return;
            document.getElementById('btnHint').disabled = true;
            alert("Life Sciences Teacher Hint: " + questions[currentLevel].hint);
        }

        function endGame(won) {
            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            if (won) {
                document.getElementById('endMessage').innerText = "Life Sciences Legend!";
                document.getElementById('endPrize').innerText = "R1,000,000";
            } else {
                document.getElementById('endMessage').innerText = "Final Winnings:";
                document.getElementById('endPrize').innerText = currentLevel > 0 ? prizes[currentLevel - 1] : "R0";
            }
        }
        loadQuestion();
    </script>
</body>
</html>
