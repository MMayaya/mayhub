<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May Learning Hub | Grade 8 History Master Quiz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        nav { background-color: #002b5e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #cce0ff; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-decoration: underline; }
        
        .game-header { text-align: center; padding: 2rem 1rem 1rem; }
        .game-title { color: #004080; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .game-subtitle { color: #555; margin-bottom: 1.5rem; font-size: 1.1rem; }

        .game-wrapper { display: flex; max-width: 1100px; margin: 0 auto 3rem; gap: 2rem; padding: 0 20px; width: 100%; align-items: flex-start; }
        
        .game-board { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 6px solid #3385ff; padding: 2rem; display: flex; flex-direction: column; }
        
        .lifelines { display: flex; justify: center; gap: 1rem; margin-bottom: 2rem; }
        .lifeline-btn { background: #002b5e; color: #fff; border: 2px solid #b3d4ff; padding: 0.8rem 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .lifeline-btn:hover:not(:disabled) { background: #3385ff; transform: translateY(-2px); }
        .lifeline-btn:disabled { background: #ccc; border-color: #aaa; color: #666; cursor: not-allowed; transform: none; box-shadow: none; text-decoration: line-through; }

        .question-box { background: #004080; color: #fff; padding: 2rem; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 2rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .answer-btn { background: #f0f7ff; border: 2px solid #3385ff; color: #002b5e; padding: 1.2rem; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: left; position: relative; overflow: hidden; }
        .answer-btn::before { content: attr(data-letter) ": "; color: #3385ff; margin-right: 0.5rem; }
        .answer-btn:hover:not(:disabled) { background: #e6f0fa; border-color: #004080; transform: scale(1.02); }
        
        .answer-btn.selected { background: #ffc107; border-color: #d39e00; color: #000; }
        .answer-btn.correct { background: #28a745 !important; border-color: #1e7e34 !important; color: #fff !important; }
        .answer-btn.incorrect { background: #dc3545 !important; border-color: #bd2130 !important; color: #fff !important; }
        .answer-btn.hidden { visibility: hidden; }

        .prize-ladder { width: 250px; background: #001a33; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column-reverse; gap: 0.1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.2); max-height: 600px; overflow-y: auto; }
        .ladder-step { display: flex; justify-content: space-between; padding: 0.2rem 0.6rem; color: #66a3ff; font-weight: bold; border-radius: 4px; transition: all 0.3s; font-size: 0.85rem; }
        .ladder-step.active { background: #ffc107; color: #000; transform: scale(1.05); }
        .ladder-step.passed { color: #28a745; }
        .ladder-step.milestone { color: #fff; border-bottom: 1px solid rgba(255,255,255,0.2); } 

        #endScreen { display: none; text-align: center; padding: 3rem 1rem; }
        #endMessage { font-size: 1.8rem; color: #004080; margin-bottom: 1rem; }
        #endPrize { font-size: 2.5rem; color: #28a745; font-weight: bold; margin-bottom: 2rem; }

        @media (max-width: 850px) {
            .game-wrapper { flex-direction: column; }
            .prize-ladder { width: 100%; flex-direction: row; flex-wrap: wrap; height: auto; } 
            .answers-grid { grid-template-columns: 1fr; }
        }
        
        footer { text-align: center; padding: 1rem; background-color: #002b5e; color: #fff; margin-top: auto; }
    </style>
</head>
<body>

    <nav>
        <a href="../../../../../../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../../../../../../index.html">Home</a>
            <a href="../../../../../../about.html">About</a>
        </div>
    </nav>

    <header class="game-header">
        <h1 class="game-title">History Master Quiz</h1>
        <p class="game-subtitle">30-Question Challenge: The Scramble for Africa</p>
        <p style="font-size: 0.78rem; color: #52606d; margin-top: 0.45rem;">Source: The Scramble for Africa - Grade 8 Social Sciences Term 3 presentation.</p>
    </header>

    <main class="game-wrapper">
        <div class="game-board" id="gameBoard">
            <div class="lifelines">
                <button class="lifeline-btn" id="btn5050" onclick="use5050()">50 / 50</button>
                <button class="lifeline-btn" id="btnHint" onclick="useHint()">Get a Hint</button>
            </div>

            <div class="question-box">
                <span id="questionText">Loading question...</span>
            </div>

            <div class="answers-grid">
                <button class="answer-btn" data-letter="A" id="btn0" onclick="selectAnswer(0)"></button>
                <button class="answer-btn" data-letter="B" id="btn1" onclick="selectAnswer(1)"></button>
                <button class="answer-btn" data-letter="C" id="btn2" onclick="selectAnswer(2)"></button>
                <button class="answer-btn" data-letter="D" id="btn3" onclick="selectAnswer(3)"></button>
            </div>
        </div>

        <div class="game-board" id="endScreen">
            <h2 id="endMessage">Game Over!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">Your final score:</p>
            <div id="endPrize">0 Pts</div>
            <button class="lifeline-btn" onclick="location.reload()">Try Again</button>
        </div>

        <div class="prize-ladder" id="prizeLadder"></div>
    </main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

    <script src="../../../../../../game-audio.js"></script>
    <script>
        const questions = [
            {
                "q": "From which century did Europeans begin exploring continents outside Europe?",
                "options": [
                    "19th century",
                    "15th century",
                    "11th century",
                    "20th century"
                ],
                "a": 1,
                "hint": "The chapter begins with early European exploration."
            },
            {
                "q": "What were European explorers searching for?",
                "options": [
                    "Fixed African borders",
                    "Independent colonies",
                    "Trade and profit",
                    "Only new weapons"
                ],
                "a": 2,
                "hint": "Economic motives encouraged exploration."
            },
            {
                "q": "What improved during the European Renaissance?",
                "options": [
                    "Navigation technology, ships and weapons",
                    "African political borders",
                    "Railways throughout Africa",
                    "The Berlin Conference"
                ],
                "a": 0,
                "hint": "These developments made long voyages and conquest easier."
            },
            {
                "q": "What is colonialism?",
                "options": [
                    "Equal trade between countries",
                    "Occupation and control of one nation by another",
                    "A cartoon about an empire",
                    "Rule by several governments"
                ],
                "a": 1,
                "hint": "It involves control of land and people."
            },
            {
                "q": "What is a colony?",
                "options": [
                    "A territory taken over by another country",
                    "An independent trading route",
                    "A European conference",
                    "A historical cartoon"
                ],
                "a": 0,
                "hint": "It becomes part of the controlling country's empire."
            },
            {
                "q": "What is an empire?",
                "options": [
                    "One village without a ruler",
                    "A trade route across an ocean",
                    "A group of countries ruled by one government",
                    "A meeting of kingdoms"
                ],
                "a": 2,
                "hint": "A colony joins this wider political structure."
            },
            {
                "q": "What was the Scramble for Africa?",
                "options": [
                    "African competition for Europe",
                    "European competition for African territories",
                    "A search for old borders",
                    "The end of colonialism"
                ],
                "a": 1,
                "hint": "European powers wanted control of the same continent."
            },
            {
                "q": "When did this competition become especially intense?",
                "options": [
                    "Late 19th century",
                    "Early 15th century",
                    "Late 20th century",
                    "By 1800 only"
                ],
                "a": 0,
                "hint": "It accelerated around the Berlin Conference period."
            },
            {
                "q": "Who ruled most of Africa before European colonisation?",
                "options": [
                    "No one",
                    "Europeans",
                    "Africans",
                    "One Berlin government"
                ],
                "a": 2,
                "hint": "The continent contained its own political societies."
            },
            {
                "q": "Which statement about pre-colonial borders is correct?",
                "options": [
                    "All were fixed like modern borders",
                    "They were drawn at Berlin in 1800",
                    "There were no societies",
                    "Borders were not always fixed"
                ],
                "a": 3,
                "hint": "Kingdoms and states did not always have modern boundaries."
            },
            {
                "q": "Which list describes African ways of life?",
                "options": [
                    "Only factory work",
                    "Hunting, gathering, herding and farming",
                    "Only sea travel",
                    "Only mining"
                ],
                "a": 1,
                "hint": "African societies followed different ways of life."
            },
            {
                "q": "How were relations between African societies described?",
                "options": [
                    "Always peaceful",
                    "Always at war",
                    "Sometimes peaceful and sometimes involving war",
                    "Completely absent"
                ],
                "a": 2,
                "hint": "Relationships varied."
            },
            {
                "q": "Which was an important African trading kingdom?",
                "options": [
                    "Mali",
                    "Berlin",
                    "Germany",
                    "Colonial Liberia"
                ],
                "a": 0,
                "hint": "Egypt, Mapungubwe, Great Zimbabwe and Mali are listed."
            },
            {
                "q": "What did Swahili routes connect?",
                "options": [
                    "Africa with Indian Ocean trade",
                    "Europe with the Arctic only",
                    "Berlin with Liberia",
                    "Colonies with no trade"
                ],
                "a": 0,
                "hint": "These routes existed before late-19th-century colonisation."
            },
            {
                "q": "What was true of Africa by 1800?",
                "options": [
                    "No one lived inland",
                    "People were settled throughout the continent",
                    "It had become 46 colonies",
                    "Only two kingdoms existed"
                ],
                "a": 1,
                "hint": "Maps show numerous kingdoms, states and empires."
            },
            {
                "q": "By which decade were European powers competing for African territories?",
                "options": [
                    "1470s",
                    "1770s",
                    "1870s",
                    "1970s"
                ],
                "a": 2,
                "hint": "Several countries wanted the same territories."
            },
            {
                "q": "What danger resulted from European competition?",
                "options": [
                    "European powers might fight one another",
                    "No European interest",
                    "African control of Europe",
                    "The end of navigation"
                ],
                "a": 0,
                "hint": "The conference was intended to avoid this conflict."
            },
            {
                "q": "Who invited European powers to a major conference?",
                "options": [
                    "An African king",
                    "Otto von Bismarck",
                    "A Swahili trader",
                    "A cartoonist"
                ],
                "a": 1,
                "hint": "He was the German Prime Minister."
            },
            {
                "q": "Where was the conference held?",
                "options": [
                    "Mali",
                    "London, Britain",
                    "Berlin, Germany",
                    "Liberia"
                ],
                "a": 2,
                "hint": "Its location gives the conference its name."
            },
            {
                "q": "When was the Berlin Conference held?",
                "options": [
                    "1800",
                    "1870",
                    "1884",
                    "1914"
                ],
                "a": 2,
                "hint": "This date is central to the timeline."
            },
            {
                "q": "What was the main purpose of the Berlin Conference?",
                "options": [
                    "To divide Africa without European powers fighting",
                    "To let Africans choose borders",
                    "To restore African rule",
                    "To establish Swahili trade"
                ],
                "a": 0,
                "hint": "The powers made rules for their own competition."
            },
            {
                "q": "Which group was not invited to the Berlin Conference?",
                "options": [
                    "German officials",
                    "European powers",
                    "Africans",
                    "Otto von Bismarck"
                ],
                "a": 2,
                "hint": "Decisions about Africa were made without African participation."
            },
            {
                "q": "How many European countries controlled almost all of Africa?",
                "options": [
                    "Two",
                    "Seven",
                    "Forty-six",
                    "Ninety-eight"
                ],
                "a": 1,
                "hint": "Britain, France, Portugal, Germany, Belgium, Italy and Spain."
            },
            {
                "q": "Which three gained some of the largest territories?",
                "options": [
                    "Britain, France and Germany",
                    "Ethiopia, Liberia and Mali",
                    "Italy, Spain and Liberia",
                    "Egypt, Mali and Mapungubwe"
                ],
                "a": 0,
                "hint": "They were among Europe's strongest powers."
            },
            {
                "q": "About what percentage of Africa was controlled at one stage?",
                "options": [
                    "46%",
                    "7%",
                    "98%",
                    "14%"
                ],
                "a": 2,
                "hint": "Almost the whole continent was controlled."
            },
            {
                "q": "By which year had almost all of Africa been colonised?",
                "options": [
                    "1800",
                    "1884",
                    "1914",
                    "1970"
                ],
                "a": 2,
                "hint": "This is the endpoint of the chapter timeline."
            },
            {
                "q": "Which two countries remained independent?",
                "options": [
                    "Britain and France",
                    "Ethiopia and Liberia",
                    "Egypt and Mali",
                    "Germany and Spain"
                ],
                "a": 1,
                "hint": "They were exceptions to continent-wide colonial rule."
            },
            {
                "q": "About how many colonies was Africa divided into?",
                "options": [
                    "Seven",
                    "Fourteen",
                    "Forty-six",
                    "Ninety-eight"
                ],
                "a": 2,
                "hint": "This is a number, not a percentage."
            },
            {
                "q": "What do historical cartoons communicate?",
                "options": [
                    "Only jokes",
                    "An exact photograph",
                    "A point of view about an issue or event",
                    "No message without words"
                ],
                "a": 2,
                "hint": "Cartoonists use images and symbols to make a point."
            },
            {
                "q": "Why was colonisation a turning point?",
                "options": [
                    "It shifted political control from Africans to European powers",
                    "It ended all trade before 1800",
                    "It created the first African societies",
                    "It made every country independent"
                ],
                "a": 0,
                "hint": "The political control of the continent changed dramatically."
            }
        ];

                let currentLevel = 0;
        let isWaiting = false;

        const ladderContainer = document.getElementById('prizeLadder');
        for (let i = 0; i < 30; i++) {
            let step = document.createElement('div');
            step.className = 'ladder-step';
            step.id = `ladder-${i}`;
            if ((i + 1) % 5 === 0) step.classList.add('milestone');
            step.innerHTML = `<span>${i + 1}</span> <span>Q-Point</span>`;
            ladderContainer.appendChild(step);
        }

        function loadQuestion() {
            isWaiting = false;
            document.querySelectorAll('.ladder-step').forEach((el, index) => {
                el.classList.remove('active');
                if (index < currentLevel) el.classList.add('passed');
            });
            document.getElementById(`ladder-${currentLevel}`).classList.add('active');

            const qData = questions[currentLevel];
            document.getElementById('questionText').innerText = `Q${currentLevel + 1}: ${qData.q}`;

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn${i}`);
                btn.innerText = qData.options[i];
                btn.className = 'answer-btn'; 
                btn.disabled = false;
            }
        }

        function selectAnswer(selectedIndex) {
            if (isWaiting) return;
            isWaiting = true;

            const qData = questions[currentLevel];
            const correctIndex = qData.a;
            if (selectedIndex === correctIndex) MayHubSounds.playCorrect();
            else MayHubSounds.playWrong();
            
            for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).disabled = true;
            }

            const selectedBtn = document.getElementById(`btn${selectedIndex}`);
            selectedBtn.classList.add('selected');

            setTimeout(() => {
                selectedBtn.classList.remove('selected');

                if (selectedIndex === correctIndex) {
                    selectedBtn.classList.add('correct');
                    setTimeout(() => {
                        currentLevel++;
                        if (currentLevel >= 30) endGame(true);
                        else loadQuestion();
                    }, 1000); 
                } else {
                    selectedBtn.classList.add('incorrect');
                    document.getElementById(`btn${correctIndex}`).classList.add('correct');
                    setTimeout(() => endGame(false), 2000);
                }
            }, 1000);
        }

        function use5050() {
            if (isWaiting) return;
            document.getElementById('btn5050').disabled = true;
            const correctIndex = questions[currentLevel].a;
            let wrongIndexes = [0, 1, 2, 3].filter(i => i !== correctIndex);
            wrongIndexes.sort(() => Math.random() - 0.5);
            document.getElementById(`btn${wrongIndexes[0]}`).classList.add('hidden');
            document.getElementById(`btn${wrongIndexes[1]}`).classList.add('hidden');
        }

        function useHint() {
            if (isWaiting) return;
            document.getElementById('btnHint').disabled = true;
            alert("Study Hint: " + questions[currentLevel].hint);
        }

        function endGame(won) {
            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            if (won) {
                document.getElementById('endMessage').innerText = "History Legend!";
                document.getElementById('endPrize').innerText = "30/30 - 100%";
            } else {
                document.getElementById('endMessage').innerText = "Keep Studying!";
                document.getElementById('endPrize').innerText = `${currentLevel}/30 Correct`;
            }
        }
        loadQuestion();
    </script>
</body>
</html>
