    <title>May Learning Hub | Exam Resource Coming Soon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff5f5; color: #2a1111; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        nav { background-color: #4a0000; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-links a { color: #ffd6d6; text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a:focus-visible, .nav-links a.active { color: #fff; text-decoration: underline; }
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; }
        .coming-soon-card { width: min(640px, 100%); background: #fff; border-radius: 8px; box-shadow: 0 10px 30px rgba(74, 0, 0, 0.16); border-top: 6px solid #8b0000; padding: 4rem 3rem; text-align: center; opacity: 0; animation: fadeInUp 0.8s ease-out forwards; }
        .document-icon { width: 4rem; height: 4.8rem; margin: 0 auto 1.3rem; border: 4px solid #8b0000; border-radius: 4px; position: relative; animation: float 3s ease-in-out infinite; }
        .document-icon::before, .document-icon::after { content: ''; position: absolute; left: 0.75rem; right: 0.75rem; height: 4px; border-radius: 2px; background: #8b0000; }
        .document-icon::before { top: 1.35rem; }
        .document-icon::after { top: 2.3rem; }
        .coming-soon-card h1 { color: #6f0000; font-size: 2.2rem; margin-bottom: 1rem; }
        .coming-soon-card p { font-size: 1.1rem; color: #4d3535; margin-bottom: 1.2rem; }
        .resource-details { color: #6f0000; font-weight: 700; }
        .back-btn { display: inline-block; background-color: #650000; color: #fff; text-decoration: none; padding: 0.8rem 2rem; border-radius: 30px; font-weight: bold; font-size: 1.05rem; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(101, 0, 0, 0.32); }
        .back-btn:hover, .back-btn:focus-visible { background-color: #9b0000; transform: translateY(-3px); box-shadow: 0 7px 18px rgba(155, 0, 0, 0.4); }
        footer { text-align: center; padding: 1rem; background-color: #4a0000; color: #fff; margin-top: auto; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @media (prefers-reduced-motion: reduce) { .coming-soon-card, .document-icon { animation: none; opacity: 1; } }
        @media (max-width: 640px) { nav { flex-direction: column; gap: 0.75rem; padding: 1rem; } .nav-links a { margin: 0 0.55rem; } .container { padding: 1.25rem; } .coming-soon-card { padding: 3rem 1.5rem; } .coming-soon-card h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>
    <nav aria-label="Main navigation">
        <a href="../index.html" class="logo">May Learning Hub</a>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../exam-hub.html" class="active">Exam Hub</a>
            <a href="../about.html">About</a>
        </div>
    </nav>

    <main class="container">
        <section class="coming-soon-card" aria-labelledby="pageTitle">
            <div class="document-icon" aria-hidden="true"></div>
            <h1 id="pageTitle">Exam Resource Coming Soon</h1>
            <p class="resource-details" id="resourceDetails">This exam resource is being prepared.</p>
            <p id="resourceMessage">It will be added to the Past Exam Papers Hub as soon as it has been checked and prepared.</p>
            <p><strong>Please check back soon.</strong></p>
            <a href="../exam-hub.html" class="back-btn">&larr; Return to Exam Hub</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 May Learning Hub. All rights reserved.</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const subject = params.get('subject');
        const grade = params.get('grade');
        const exam = params.get('exam');
        const paper = params.get('paper');
        const resource = params.get('resource');

        if (subject && grade && exam && paper && resource) {
            const pageTitle = `${resource} Coming Soon`;
            document.getElementById('pageTitle').textContent = pageTitle;
            document.getElementById('resourceDetails').textContent = `${subject} | ${grade} | ${exam}`;
            document.getElementById('resourceMessage').textContent = `The ${paper} ${resource.toLowerCase()} is not available yet. It will be added to the Past Exam Papers Hub as soon as it has been checked and prepared.`;
            document.title = `May Learning Hub | ${pageTitle}`;
        }
    </script>
</body>
